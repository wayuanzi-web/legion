<title>萬軍破陣</title>
<!--FONTS-->
<style>
/* 版面：直向戰場佔滿整個舞台；選單是蓋在戰場上的切角軍牌，金線描邊。 */
@font-face { font-family: "NumFB"; font-weight: 400; src: local("Arial Black"), local("Arial-Black"), local("Roboto Black"), local("Roboto-Black"), local("HelveticaNeue-CondensedBlack"), local("DejaVu Sans Bold"), local("DejaVuSans-Bold"), local("Arial Bold"), local("Arial-BoldMT"); }
:root {
  color-scheme: dark;
  --ink: #120f1c; --panel: #1d1830; --panel-2: #2b2446; --line: #51457c;
  --bone: #f6eeda; --mute: #aea6c8;
  --blue: #3d86ff; --blue-deep: #1b46b8; --red: #ee3b30; --red-deep: #8f1418;
  --gold: #ffc93c; --gold-lt: #fff0b0; --gold-deep: #b9790f; --gold-ink: #3a2203;
  --f-display: "Noto Serif TC", "Songti TC", "Source Han Serif TC", "PMingLiU", serif;
  --f-num: "Lilita One", "NumFB", system-ui, sans-serif;
  --f-body: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  --cut: 10px;
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; overflow: hidden; background: var(--ink); }
body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--bone); font-family: var(--f-body); font-size: 15px; overflow: hidden;
  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--gold-lt); outline-offset: 2px; }
#app { position: relative; height: 100%; display: flex; justify-content: center; overflow: hidden;
  background: radial-gradient(120% 80% at 50% 0%, #2a2146 0%, var(--ink) 70%); }
#stage { position: relative; height: 100%; width: 100%; overflow: hidden; background: #0d1019; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.chamfer { clip-path: polygon(var(--cut) 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, var(--cut) 100%, 0 calc(100% - var(--cut)), 0 var(--cut)); }

/* ---------- 戰鬥中的資訊列 ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; }
.hud-top { position: absolute; left: 0; right: 0; top: 0; padding: 8px 12px 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center;
  background: linear-gradient(180deg, rgba(14, 10, 26, .82), rgba(14, 10, 26, .5) 70%, rgba(14, 10, 26, 0)); }
#btnPause { pointer-events: auto; width: 40px; height: 40px; display: grid; place-items: center; background: rgba(255, 255, 255, .1); --cut: 8px; }
#btnPause i { display: block; width: 14px; height: 15px; border-left: 5px solid var(--bone); border-right: 5px solid var(--bone); box-sizing: border-box; }
.hud-lv { min-width: 0; line-height: 1.15; }
.hud-lv small { display: block; font-size: 11px; letter-spacing: .12em; color: var(--mute); }
.hud-lv b { font-family: var(--f-display); font-weight: 900; font-size: 19px; letter-spacing: .06em; }
.hud-kills { text-align: right; line-height: 1.05; }
.hud-kills small { display: block; font-size: 11px; letter-spacing: .12em; color: var(--mute); }
.hud-kills b { font-family: var(--f-num); font-weight: 400; font-size: 26px; color: var(--gold); text-shadow: 0 2px 0 #3a2203; font-variant-numeric: tabular-nums; display: inline-block; transform-origin: 100% 60%; }
.hud-kills b.pop { animation: pop .18s ease-out; }
@keyframes pop { 0% { transform: scale(1.28); } 100% { transform: scale(1); } }
.tug { grid-column: 1 / -1; display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; font-family: var(--f-num); font-size: 15px; font-variant-numeric: tabular-nums; }
.tug span:first-child { color: #8fbfff; } .tug span:last-child { color: #ff9a8a; }
.tug span small { font-family: var(--f-body); font-size: 11px; letter-spacing: .1em; margin: 0 4px 0 0; opacity: .85; }
.tug span:last-child small { margin: 0 0 0 4px; }
.tug.boss .track { background: #2a0810; } .tug.boss .track i { background: linear-gradient(180deg, #ff7a5c, #c41e1e); } .tug.boss .track::after { display: none; }
.tug .track { height: 10px; background: var(--red); position: relative; overflow: hidden; --cut: 4px; box-shadow: 0 0 0 2px rgba(10, 6, 20, .8); }
.tug .track i { position: absolute; inset: 0; background: linear-gradient(180deg, #7fb8ff, var(--blue)); transform-origin: 0 50%; transform: scaleX(.5); }
.tug .track::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 2px; background: rgba(255, 255, 255, .55); }
.hud-bot { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 12px 10px; display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end;
  background: linear-gradient(0deg, rgba(14, 10, 26, .78), rgba(14, 10, 26, 0)); }
.meters { display: grid; gap: 6px; min-width: 0; }
.meter { display: grid; grid-template-columns: 2.6em 1fr 3.9em; gap: 8px; align-items: center; font-size: 12px; letter-spacing: .08em; color: var(--mute); }
.meter b { font-family: var(--f-num); font-weight: 400; font-size: 15px; color: var(--bone); font-variant-numeric: tabular-nums; letter-spacing: 0; white-space: nowrap; }
.meter .track { height: 11px; background: rgba(255, 255, 255, .13); position: relative; overflow: hidden; --cut: 4px; }
.meter .track i { position: absolute; inset: 0; transform-origin: 0 50%; }
#wallBar { background: linear-gradient(180deg, #9be28a, #3fae4e); }
#wallBar.warn { background: linear-gradient(180deg, #ffb37a, #ee3b30); }
#heroBar { background: linear-gradient(180deg, var(--gold-lt), var(--gold)); }
.meter.ready b { color: var(--gold); }
#btnUlt { pointer-events: auto; position: relative; width: 78px; height: 78px; border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(var(--gold) calc(var(--p, 0) * 1turn), rgba(255, 255, 255, .14) 0); filter: drop-shadow(0 3px 0 rgba(0, 0, 0, .5)); }
#btnUlt::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #3b3260, #191428); }
#btnUlt span { position: relative; font-family: var(--f-display); font-weight: 900; font-size: 19px; letter-spacing: .08em; color: var(--mute); line-height: 1.05; text-align: center; }
#btnUlt small { display: block; font-family: var(--f-num); font-size: 12px; letter-spacing: 0; color: var(--mute); }
#btnUlt.ready { animation: ult 0.7s ease-in-out infinite alternate; }
#btnUlt.ready::before { background: radial-gradient(circle at 50% 35%, #fff0b0, #ffb81f 60%, #b9790f); }
#btnUlt.ready span, #btnUlt.ready small { color: var(--gold-ink); }
@keyframes ult { from { transform: scale(1); filter: drop-shadow(0 0 0 rgba(255, 200, 60, 0)) drop-shadow(0 3px 0 rgba(0, 0, 0, .5)); } to { transform: scale(1.08); filter: drop-shadow(0 0 14px rgba(255, 200, 60, .9)) drop-shadow(0 3px 0 rgba(0, 0, 0, .5)); } }

#banner { position: absolute; left: 0; right: 0; top: 30%; text-align: center; font-family: var(--f-display); font-weight: 900; font-size: clamp(34px, 11vmin, 58px); letter-spacing: .1em; line-height: 1.1;
  padding: 10px 16px; opacity: 0; text-wrap: balance; }
#banner.show { animation: banner 1.7s cubic-bezier(.2, .9, .3, 1) both; }
#banner small { display: block; font-family: var(--f-num); font-size: .34em; letter-spacing: .3em; margin-bottom: 2px; }
#banner.gold { color: var(--gold); text-shadow: 0 3px 0 #3a2203, 0 0 22px rgba(255, 190, 40, .7); }
#banner.red { color: #ff6a55; text-shadow: 0 3px 0 #3a0508, 0 0 22px rgba(255, 60, 40, .7); }
#banner.blue { color: #cfe4ff; text-shadow: 0 3px 0 #0f2a78, 0 0 22px rgba(80, 150, 255, .8); }
#banner.boss { color: #ff4a3a; text-shadow: 0 3px 0 #2a0206, 0 0 30px rgba(255, 30, 20, .9);
  background: repeating-linear-gradient(135deg, rgba(255, 200, 40, .0) 0 14px, rgba(255, 200, 40, .0) 14px 28px), linear-gradient(90deg, transparent, rgba(20, 0, 4, .78) 20%, rgba(20, 0, 4, .78) 80%, transparent); }
#banner.boss small { color: var(--gold); }
@keyframes banner { 0% { opacity: 0; transform: scale(1.7); } 12% { opacity: 1; transform: scale(1); } 78% { opacity: 1; transform: scale(1.03); } 100% { opacity: 0; transform: scale(1.1); } }
#say { position: absolute; left: 50%; top: 21%; transform: translateX(-50%); padding: 6px 16px; font-weight: 700; font-size: 15px; letter-spacing: .08em; line-height: 1.4; text-align: center; text-wrap: balance; opacity: 0;
  background: rgba(18, 12, 30, .86); --cut: 7px; width: max-content; max-width: calc(100% - 32px); }
#say.show { animation: say 2.6s ease both; }
#say.alert { color: #ffb0a2; box-shadow: inset 0 0 0 2px var(--red); background: rgba(60, 8, 10, .88); }
@keyframes say { 0% { opacity: 0; transform: translate(-50%, -8px); } 10%, 82% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, 0); } }
#mile { position: absolute; right: 12px; top: 104px; font-family: var(--f-display); font-weight: 900; font-size: 24px; letter-spacing: .12em; color: var(--gold-lt);
  text-shadow: 0 2px 0 #3a2203, 0 0 14px rgba(255, 190, 40, .8); opacity: 0; transform-origin: 100% 50%; }
#mile.show { animation: mile 1.5s ease both; }
@keyframes mile { 0% { opacity: 0; transform: scale(2.2) rotate(-6deg); } 14% { opacity: 1; transform: scale(1) rotate(-6deg); } 80% { opacity: 1; transform: scale(1) rotate(-6deg); } 100% { opacity: 0; transform: scale(.9) rotate(-6deg); } }
#hint { position: absolute; left: 50%; bottom: 22%; transform: translateX(-50%); padding: 8px 18px; font-weight: 700; letter-spacing: .1em; white-space: nowrap;
  background: rgba(18, 12, 30, .82); --cut: 8px; animation: nudge 1.1s ease-in-out infinite alternate; }
@keyframes nudge { from { transform: translateX(calc(-50% - 10px)); } to { transform: translateX(calc(-50% + 10px)); } }

/* ---------- 主畫面 ---------- */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: max(18px, 4vh) 18px max(18px, 3vh); touch-action: pan-y;
  background: linear-gradient(180deg, rgba(14, 10, 28, .78) 0%, rgba(14, 10, 28, .35) 34%, rgba(14, 10, 28, .55) 62%, rgba(14, 10, 28, .92) 100%); overflow-y: auto; }
.logo { text-align: center; margin-top: 2vh; }
.logo .tagline { margin: 0 0 2px; font-size: 13px; letter-spacing: .5em; text-indent: .5em; color: var(--gold-lt); opacity: .9; }
.logo h1 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: clamp(52px, 19vmin, 92px); line-height: 1.05; letter-spacing: .06em; text-indent: .06em;
  background: linear-gradient(180deg, #fff6cf 8%, #ffd04a 46%, #c9820d 82%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 3px 0 #3a2203) drop-shadow(0 0 20px rgba(255, 170, 30, .45)); }
.logo .rule { height: 12px; margin: 4px auto 0; width: min(260px, 70%); position: relative; }
.logo .rule::before { content: ""; position: absolute; left: 0; right: 0; top: 5px; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
.logo .rule::after { content: ""; position: absolute; left: 50%; top: 0; width: 10px; height: 10px; margin-left: -5px; background: var(--gold); transform: rotate(45deg); box-shadow: 0 0 10px rgba(255, 200, 60, .8); }
.spacer { flex: 1 1 0; min-height: 8px; }
.lvls { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; max-width: 420px; }
.lv { position: relative; aspect-ratio: 1 / 1.22; display: grid; grid-template-rows: 1fr auto; place-items: center; padding: 6px 2px 7px; background: var(--line); --cut: 9px; transition: transform .12s ease; }
.lv::before { content: ""; position: absolute; inset: 2px; background: linear-gradient(180deg, var(--panel-2), var(--panel)); clip-path: inherit; }
.lv > * { position: relative; }
.lv b { font-family: var(--f-num); font-weight: 400; font-size: 30px; line-height: 1; color: var(--bone); }
.lv .stars { font-size: 11px; letter-spacing: 1px; color: #5d5486; }
.lv .stars em { font-style: normal; color: var(--gold); }
.lv[aria-selected="true"] { background: var(--gold); transform: translateY(-5px) scale(1.06); }
.lv[aria-selected="true"]::before { background: linear-gradient(180deg, #4a3c1a, #2a2010); }
.lv[aria-selected="true"] b { color: var(--gold); }
.lv.locked b { color: #5d5486; }
.lv.locked::after { content: ""; position: absolute; left: 50%; top: 36%; width: 16px; height: 13px; margin: 0 0 0 -8px; background: #5d5486; border-radius: 3px; box-shadow: 0 -9px 0 -4px var(--panel), 0 -9px 0 -1px #5d5486; }
.lv.locked b { opacity: 0; }
.lvinfo { width: 100%; max-width: 420px; text-align: center; min-height: 92px; padding: 10px 14px 12px; background: rgba(14, 10, 28, .72); --cut: 10px; }
.lvinfo h2 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: 28px; letter-spacing: .12em; text-indent: .12em; }
.lvinfo h2 small { font-family: var(--f-body); font-weight: 700; font-size: 12px; letter-spacing: .12em; vertical-align: middle; margin-left: 8px; padding: 2px 8px; color: var(--gold-ink); background: var(--gold); }
.lvinfo p { margin: 6px auto 0; max-width: 22em; color: #cfc8e6; font-size: 14px; line-height: 1.5; text-wrap: balance; }
.actions { width: 100%; max-width: 420px; display: grid; gap: 10px; }
.actions .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn { position: relative; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 8px 14px; font-weight: 700; font-size: 16px; letter-spacing: .14em; text-indent: .14em;
  color: var(--bone); background: var(--line); --cut: 9px; clip-path: polygon(var(--cut) 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, var(--cut) 100%, 0 calc(100% - var(--cut)), 0 var(--cut)); transition: transform .08s ease, filter .08s ease; }
.btn::before { content: ""; position: absolute; inset: 2px; background: linear-gradient(180deg, var(--panel-2), var(--panel)); clip-path: inherit; }
.btn > * , .btn { z-index: 0; } .btn span, .btn b, .btn em { position: relative; }
.btn:active { transform: translateY(2px) scale(.985); filter: brightness(1.15); }
.btn-gold { color: var(--gold-ink); background: #fff3c0; }
.btn-gold::before { background: linear-gradient(180deg, #ffe07a, #ffb81f 55%, #d48a10); }
.btn.big { min-height: 64px; font-family: var(--f-display); font-weight: 900; font-size: 28px; letter-spacing: .4em; text-indent: .4em; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.coin { display: inline-flex; align-items: center; gap: 5px; font-style: normal; font-family: var(--f-num); letter-spacing: 0; text-indent: 0; color: var(--gold); font-size: 17px; font-variant-numeric: tabular-nums; }
.btn-gold .coin { color: var(--gold-ink); }
.coin::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3c0, #ffc93c 55%, #b9790f); box-shadow: 0 0 0 1.5px #3a2203; }

/* ---------- 軍牌（彈出視窗） ---------- */
.modal { position: absolute; inset: 0; display: grid; place-items: center; padding: 16px; background: rgba(8, 5, 16, .72); overflow-y: auto; touch-action: pan-y; -webkit-overflow-scrolling: touch; z-index: 5; }
#shop { z-index: 7; background: rgba(8, 5, 16, .88); }
#opt { z-index: 6; }
.plaque { position: relative; width: 100%; max-width: 400px; padding: 22px 18px 18px; display: grid; gap: 14px; background: var(--gold-deep); --cut: 14px; animation: rise .22s cubic-bezier(.2, .9, .3, 1.2) both; }
.plaque::before { content: ""; position: absolute; inset: 2px; background: linear-gradient(180deg, #2a2244, #18132a); clip-path: inherit; }
.plaque > * { position: relative; }
@keyframes rise { from { opacity: 0; transform: translateY(14px) scale(.96); } to { opacity: 1; transform: none; } }
.plaque h2 { margin: 0; text-align: center; font-family: var(--f-display); font-weight: 900; font-size: 34px; letter-spacing: .2em; text-indent: .2em; color: var(--gold); text-shadow: 0 2px 0 #3a2203; }
.plaque h2.lose { color: #ff6a55; text-shadow: 0 2px 0 #3a0508; }
.plaque .sub { margin: -8px 0 0; text-align: center; color: var(--mute); font-size: 14px; letter-spacing: .1em; }
.stars-big { display: flex; justify-content: center; gap: 10px; font-size: 44px; line-height: 1; color: #3d355e; }
.stars-big span.on { color: var(--gold); text-shadow: 0 0 16px rgba(255, 200, 60, .8), 0 3px 0 #3a2203; animation: starin .35s cubic-bezier(.2, .9, .3, 1.6) both; }
@keyframes starin { from { transform: scale(2.6) rotate(-30deg); opacity: 0; } to { transform: none; opacity: 1; } }
.stats { margin: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stats div { padding: 8px 10px; background: rgba(255, 255, 255, .06); display: grid; gap: 2px; }
.stats dt { font-size: 12px; letter-spacing: .12em; color: var(--mute); }
.stats dd { margin: 0; font-family: var(--f-num); font-size: 22px; font-variant-numeric: tabular-nums; }
.gain { display: flex; justify-content: center; align-items: baseline; gap: 10px; font-size: 14px; letter-spacing: .12em; color: var(--mute); }
.gain .coin { font-size: 26px; }
.tipline { margin: 0; text-align: center; color: var(--gold-lt); font-size: 14px; line-height: 1.5; text-wrap: balance; }
.stack { display: grid; gap: 10px; }
.stack.two { grid-template-columns: 1fr 1fr; }
.ups { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ups li { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 9px 10px; background: rgba(255, 255, 255, .06); }
.ups h3 { margin: 0; font-size: 16px; letter-spacing: .1em; display: flex; align-items: center; gap: 8px; }
.ups p { margin: 0; grid-column: 1; color: var(--mute); font-size: 12.5px; line-height: 1.4; }
.pips { display: inline-flex; gap: 3px; }
.pips i { width: 9px; height: 9px; background: #40376a; transform: rotate(45deg); }
.pips i.on { background: var(--gold); box-shadow: 0 0 6px rgba(255, 200, 60, .7); }
.ups .btn { grid-column: 2; grid-row: 1 / span 2; min-height: 44px; min-width: 84px; font-size: 15px; letter-spacing: 0; text-indent: 0; }
.toggles { display: grid; gap: 8px; }
.toggle { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; background: rgba(255, 255, 255, .06); font-weight: 700; letter-spacing: .1em; width: 100%; }
.toggle i { width: 46px; height: 24px; border-radius: 12px; background: #40376a; position: relative; transition: background .15s; }
.toggle i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--bone); transition: transform .15s; }
.toggle[aria-pressed="true"] i { background: var(--gold); }
.toggle[aria-pressed="true"] i::after { transform: translateX(22px); }
.seg { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; padding: 8px 12px; background: rgba(255, 255, 255, .06); font-weight: 700; letter-spacing: .1em; }
.seg div { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.seg button { min-height: 36px; padding: 4px 2px; font-weight: 700; font-size: 14px; letter-spacing: .08em; color: var(--mute); background: #40376a; }
.seg button[aria-pressed="true"] { color: var(--gold-ink); background: linear-gradient(180deg, #ffe07a, #ffb81f); }
.textbtn { color: var(--mute); font-size: 13px; letter-spacing: .1em; text-decoration: underline; text-underline-offset: 3px; padding: 8px; justify-self: center; }
#rotate { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; background: var(--ink); font-weight: 700; letter-spacing: .12em; z-index: 9; }
@media (prefers-reduced-motion: reduce) { #btnUlt.ready, #hint { animation: none; } }
</style>

<div id="app">
  <div id="stage">
    <canvas id="cv"></canvas>

    <div id="hud" hidden>
      <div class="hud-top">
        <button id="btnPause" class="chamfer" aria-label="暫停"><i></i></button>
        <div class="hud-lv"><small id="hudNo">第一關</small><b id="hudName">青草關</b></div>
        <div class="hud-kills"><small>擊殺</small><b id="hudKills">0</b></div>
        <div class="tug" id="tug"><span><small>我軍</small><b id="tugB">0</b></span><div class="track chamfer"><i id="tugBar"></i></div><span><b id="tugR">0</b><small id="tugRl">赤潮</small></span></div>
      </div>
      <div id="say" class="chamfer"></div>
      <div id="mile"></div>
      <div id="banner"></div>
      <div id="hint" class="chamfer" hidden>← 左右拖曳，移動兵砲 →</div>
      <div class="hud-bot">
        <div class="meters">
          <div class="meter" id="heroMeter"><span>大將</span><div class="track chamfer"><i id="heroBar"></i></div><b id="heroNum"></b></div>
          <div class="meter"><span>城牆</span><div class="track chamfer"><i id="wallBar"></i></div><b id="wallNum">30</b></div>
        </div>
        <button id="btnUlt" aria-label="萬箭齊發"><span>箭雨<small id="ultNum">0%</small></span></button>
      </div>
    </div>

    <section id="home" class="screen">
      <header class="logo">
        <p class="tagline">一砲轟出千軍萬馬</p>
        <h1>萬軍破陣</h1>
        <div class="rule"></div>
      </header>
      <div class="spacer"></div>
      <div class="lvls" id="lvls" role="listbox" aria-label="選擇關卡"></div>
      <div class="lvinfo chamfer"><h2 id="liName"></h2><p id="liTip"></p></div>
      <div class="actions">
        <button id="btnGo" class="btn btn-gold big"><span>出征</span></button>
        <div class="row">
          <button id="btnShop" class="btn"><span>強化</span><em class="coin" id="homeCoins">0</em></button>
          <button id="btnOpt" class="btn"><span>設定</span></button>
        </div>
      </div>
    </section>

    <div id="shop" class="modal" hidden>
      <div class="plaque chamfer">
        <h2>強化</h2>
        <p class="sub">持有 <em class="coin" id="shopCoins">0</em></p>
        <ul class="ups" id="upList"></ul>
        <button class="btn" data-close><span>返回</span></button>
      </div>
    </div>

    <div id="opt" class="modal" hidden>
      <div class="plaque chamfer">
        <h2 id="optTitle">設定</h2>
        <div class="stack" id="pauseBtns" hidden>
          <button class="btn btn-gold" id="btnResume"><span>繼續</span></button>
          <div class="stack two">
            <button class="btn" id="btnRetry"><span>重來</span></button>
            <button class="btn" id="btnQuit"><span>主畫面</span></button>
          </div>
        </div>
        <div class="toggles">
          <button class="toggle" id="tSfx" aria-pressed="true"><span>音效</span><i></i></button>
          <button class="toggle" id="tMus" aria-pressed="true"><span>配樂</span><i></i></button>
          <button class="toggle" id="tVib" aria-pressed="true"><span>震動</span><i></i></button>
        </div>
        <div class="seg" id="diffSeg"><span>難度</span><div>
          <button data-d="0" aria-pressed="false">輕鬆</button><button data-d="1" aria-pressed="true">標準</button><button data-d="2" aria-pressed="false">硬仗</button>
        </div></div>
        <div class="stack" id="homeOpts">
          <button class="textbtn" id="btnUnlock">解鎖全部關卡</button>
          <button class="textbtn" id="btnWipe">清除進度</button>
          <button class="btn" data-close><span>返回</span></button>
        </div>
      </div>
    </div>

    <div id="result" class="modal" hidden>
      <div class="plaque chamfer">
        <h2 id="resTitle">大獲全勝</h2>
        <p class="sub" id="resSub"></p>
        <div class="stars-big" id="resStars"><span>★</span><span>★</span><span>★</span></div>
        <dl class="stats">
          <div><dt>擊殺</dt><dd id="rsKills">0</dd></div>
          <div><dt>最大兵力</dt><dd id="rsArmy">0</dd></div>
          <div><dt>我軍陣亡</dt><dd id="rsLost">0</dd></div>
          <div><dt>用時</dt><dd id="rsTime">0:00</dd></div>
        </dl>
        <div class="gain"><span>戰利品</span><em class="coin" id="rsCoins">+0</em></div>
        <p class="tipline" id="resTip" hidden></p>
        <div class="stack">
          <button class="btn btn-gold" id="btnNext"><span>下一關</span></button>
          <div class="stack two">
            <button class="btn" id="btnAgain"><span>再戰</span></button>
            <button class="btn" id="btnUp"><span>強化</span></button>
          </div>
          <button class="textbtn" id="btnHome">回主畫面</button>
        </div>
      </div>
    </div>

    <div id="rotate" hidden>請把手機轉成直向再玩</div>
  </div>
</div>

<style>
/* 版面：直向戰場佔滿整個舞台；選單是蓋在戰場上的切角軍牌，金線描邊。 */
@font-face { font-family: "NumFB"; font-weight: 400; src: local("Arial Black"), local("Arial-Black"), local("Roboto Black"), local("Roboto-Black"), local("HelveticaNeue-CondensedBlack"), local("DejaVu Sans Bold"), local("DejaVuSans-Bold"), local("Arial Bold"), local("Arial-BoldMT"); }
:root {
  color-scheme: dark;
  --ink: #120f1c; --panel: #1d1830; --panel-2: #2b2446; --line: #51457c;
  --bone: #f6eeda; --mute: #aea6c8;
  --blue: #3d86ff; --blue-deep: #1b46b8; --red: #ee3b30; --red-deep: #8f1418;
  --gold: #ffc93c; --gold-lt: #fff0b0; --gold-deep: #b9790f; --gold-ink: #3a2203;
  --f-display: "Noto Serif TC", "Songti TC", "Source Han Serif TC", "PMingLiU", serif;
  --f-num: "Lilita One", "NumFB", system-ui, sans-serif;
  --f-body: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  --cut: 10px;
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; overflow: hidden; background: var(--ink); }
body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--bone); font-family: var(--f-body); font-size: 15px; overflow: hidden;
  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--gold-lt); outline-offset: 2px; }
#app { position: relative; height: 100%; display: flex; justify-content: center; overflow: hidden;
  background: radial-gradient(120% 80% at 50% 0%, #2a2146 0%, var(--ink) 70%); }
#stage { position: relative; height: 100%; width: 100%; overflow: hidden; background: #0d1019; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.chamfer { clip-path: polygon(var(--cut) 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, var(--cut) 100%, 0 calc(100% - var(--cut)), 0 var(--cut)); }

/* ---------- 戰鬥中的資訊列 ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; }
.hud-top { position: absolute; left: 0; right: 0; top: 0; padding: 8px 12px 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center;
  background: linear-gradient(180deg, rgba(14, 10, 26, .82), rgba(14, 10, 26, .5) 70%, rgba(14, 10, 26, 0)); }
#btnPause { pointer-events: auto; width: 40px; height: 40px; display: grid; place-items: center; background: rgba(255, 255, 255, .1); --cut: 8px; }
#btnPause i { display: block; width: 14px; height: 15px; border-left: 5px solid var(--bone); border-right: 5px solid var(--bone); box-sizing: border-box; }
.hud-lv { min-width: 0; line-height: 1.15; }
.hud-lv small { display: block; font-size: 11px; letter-spacing: .12em; color: var(--mute); }
.hud-lv b { font-family: var(--f-display); font-weight: 900; font-size: 19px; letter-spacing: .06em; }
.hud-kills { text-align: right; line-height: 1.05; }
.hud-kills small { display: block; font-size: 11px; letter-spacing: .12em; color: var(--mute); }
.hud-kills b { font-family: var(--f-num); font-weight: 400; font-size: 26px; color: var(--gold); text-shadow: 0 2px 0 #3a2203; font-variant-numeric: tabular-nums; display: inline-block; transform-origin: 100% 60%; }
.hud-kills b.pop { animation: pop .18s ease-out; }
@keyframes pop { 0% { transform: scale(1.28); } 100% { transform: scale(1); } }
.tug { grid-column: 1 / -1; display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; font-family: var(--f-num); font-size: 15px; font-variant-numeric: tabular-nums; }
.tug span:first-child { color: #8fbfff; } .tug span:last-child { color: #ff9a8a; }
.tug span small { font-family: var(--f-body); font-size: 11px; letter-spacing: .1em; margin: 0 4px 0 0; opacity: .85; }
.tug span:last-child small { margin: 0 0 0 4px; }
.tug.boss .track { background: #2a0810; } .tug.boss .track i { background: linear-gradient(180deg, #ff7a5c, #c41e1e); } .tug.boss .track::after { display: none; }
.tug .track { height: 10px; background: var(--red); position: relative; overflow: hidden; --cut: 4px; box-shadow: 0 0 0 2px rgba(10, 6, 20, .8); }
.tug .track i { position: absolute; inset: 0; background: linear-gradient(180deg, #7fb8ff, var(--blue)); transform-origin: 0 50%; transform: scaleX(.5); }
.tug .track::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 2px; background: rgba(255, 255, 255, .55); }
.hud-bot { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 12px 10px; display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end;
  background: linear-gradient(0deg, rgba(14, 10, 26, .78), rgba(14, 10, 26, 0)); }
.meters { display: grid; gap: 6px; min-width: 0; }
.meter { display: grid; grid-template-columns: 2.6em 1fr 3.9em; gap: 8px; align-items: center; font-size: 12px; letter-spacing: .08em; color: var(--mute); }
.meter b { font-family: var(--f-num); font-weight: 400; font-size: 15px; color: var(--bone); font-variant-numeric: tabular-nums; letter-spacing: 0; white-space: nowrap; }
.meter .track { height: 11px; background: rgba(255, 255, 255, .13); position: relative; overflow: hidden; --cut: 4px; }
.meter .track i { position: absolute; inset: 0; transform-origin: 0 50%; }
#wallBar { background: linear-gradient(180deg, #9be28a, #3fae4e); }
#wallBar.warn { background: linear-gradient(180deg, #ffb37a, #ee3b30); }
#heroBar { background: linear-gradient(180deg, var(--gold-lt), var(--gold)); }
.meter.ready b { color: var(--gold); }
#btnUlt { pointer-events: auto; position: relative; width: 78px; height: 78px; border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(var(--gold) calc(var(--p, 0) * 1turn), rgba(255, 255, 255, .14) 0); filter: drop-shadow(0 3px 0 rgba(0, 0, 0, .5)); }
#btnUlt::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #3b3260, #191428); }
#btnUlt span { position: relative; font-family: var(--f-display); font-weight: 900; font-size: 19px; letter-spacing: .08em; color: var(--mute); line-height: 1.05; text-align: center; }
#btnUlt small { display: block; font-family: var(--f-num); font-size: 12px; letter-spacing: 0; color: var(--mute); }
#btnUlt.ready { animation: ult 0.7s ease-in-out infinite alternate; }
#btnUlt.ready::before { background: radial-gradient(circle at 50% 35%, #fff0b0, #ffb81f 60%, #b9790f); }
#btnUlt.ready span, #btnUlt.ready small { color: var(--gold-ink); }
@keyframes ult { from { transform: scale(1); filter: drop-shadow(0 0 0 rgba(255, 200, 60, 0)) drop-shadow(0 3px 0 rgba(0, 0, 0, .5)); } to { transform: scale(1.08); filter: drop-shadow(0 0 14px rgba(255, 200, 60, .9)) drop-shadow(0 3px 0 rgba(0, 0, 0, .5)); } }

#banner { position: absolute; left: 0; right: 0; top: 30%; text-align: center; font-family: var(--f-display); font-weight: 900; font-size: clamp(34px, 11vmin, 58px); letter-spacing: .1em; line-height: 1.1;
  padding: 10px 16px; opacity: 0; text-wrap: balance; }
#banner.show { animation: banner 1.7s cubic-bezier(.2, .9, .3, 1) both; }
#banner small { display: block; font-family: var(--f-num); font-size: .34em; letter-spacing: .3em; margin-bottom: 2px; }
#banner.gold { color: var(--gold); text-shadow: 0 3px 0 #3a2203, 0 0 22px rgba(255, 190, 40, .7); }
#banner.red { color: #ff6a55; text-shadow: 0 3px 0 #3a0508, 0 0 22px rgba(255, 60, 40, .7); }
#banner.blue { color: #cfe4ff; text-shadow: 0 3px 0 #0f2a78, 0 0 22px rgba(80, 150, 255, .8); }
#banner.boss { color: #ff4a3a; text-shadow: 0 3px 0 #2a0206, 0 0 30px rgba(255, 30, 20, .9);
  background: repeating-linear-gradient(135deg, rgba(255, 200, 40, .0) 0 14px, rgba(255, 200, 40, .0) 14px 28px), linear-gradient(90deg, transparent, rgba(20, 0, 4, .78) 20%, rgba(20, 0, 4, .78) 80%, transparent); }
#banner.boss small { color: var(--gold); }
@keyframes banner { 0% { opacity: 0; transform: scale(1.7); } 12% { opacity: 1; transform: scale(1); } 78% { opacity: 1; transform: scale(1.03); } 100% { opacity: 0; transform: scale(1.1); } }
#say { position: absolute; left: 50%; top: 21%; transform: translateX(-50%); padding: 6px 16px; font-weight: 700; font-size: 15px; letter-spacing: .08em; line-height: 1.4; text-align: center; text-wrap: balance; opacity: 0;
  background: rgba(18, 12, 30, .86); --cut: 7px; width: max-content; max-width: calc(100% - 32px); }
#say.show { animation: say 2.6s ease both; }
#say.alert { color: #ffb0a2; box-shadow: inset 0 0 0 2px var(--red); background: rgba(60, 8, 10, .88); }
@keyframes say { 0% { opacity: 0; transform: translate(-50%, -8px); } 10%, 82% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, 0); } }
#mile { position: absolute; right: 12px; top: 104px; font-family: var(--f-display); font-weight: 900; font-size: 24px; letter-spacing: .12em; color: var(--gold-lt);
  text-shadow: 0 2px 0 #3a2203, 0 0 14px rgba(255, 190, 40, .8); opacity: 0; transform-origin: 100% 50%; }
#mile.show { animation: mile 1.5s ease both; }
@keyframes mile { 0% { opacity: 0; transform: scale(2.2) rotate(-6deg); } 14% { opacity: 1; transform: scale(1) rotate(-6deg); } 80% { opacity: 1; transform: scale(1) rotate(-6deg); } 100% { opacity: 0; transform: scale(.9) rotate(-6deg); } }
#hint { position: absolute; left: 50%; bottom: 22%; transform: translateX(-50%); padding: 8px 18px; font-weight: 700; letter-spacing: .1em; white-space: nowrap;
  background: rgba(18, 12, 30, .82); --cut: 8px; animation: nudge 1.1s ease-in-out infinite alternate; }
@keyframes nudge { from { transform: translateX(calc(-50% - 10px)); } to { transform: translateX(calc(-50% + 10px)); } }

/* ---------- 主畫面 ---------- */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: max(18px, 4vh) 18px max(18px, 3vh); touch-action: pan-y;
  background: linear-gradient(180deg, rgba(14, 10, 28, .78) 0%, rgba(14, 10, 28, .35) 34%, rgba(14, 10, 28, .55) 62%, rgba(14, 10, 28, .92) 100%); overflow-y: auto; }
.logo { text-align: center; margin-top: 2vh; }
.logo .tagline { margin: 0 0 2px; font-size: 13px; letter-spacing: .5em; text-indent: .5em; color: var(--gold-lt); opacity: .9; }
.logo h1 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: clamp(52px, 19vmin, 92px); line-height: 1.05; letter-spacing: .06em; text-indent: .06em;
  background: linear-gradient(180deg, #fff6cf 8%, #ffd04a 46%, #c9820d 82%); -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 3px 0 #3a2203) drop-shadow(0 0 20px rgba(255, 170, 30, .45)); }
.logo .rule { height: 12px; margin: 4px auto 0; width: min(260px, 70%); position: relative; }
.logo .rule::before { content: ""; position: absolute; left: 0; right: 0; top: 5px; height: 2px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
.logo .rule::after { content: ""; position: absolute; left: 50%; top: 0; width: 10px; height: 10px; margin-left: -5px; background: var(--gold); transform: rotate(45deg); box-shadow: 0 0 10px rgba(255, 200, 60, .8); }
.spacer { flex: 1 1 0; min-height: 8px; }
.lvls { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; width: 100%; max-width: 420px; }
.lv { position: relative; aspect-ratio: 1 / 1.22; display: grid; grid-template-rows: 1fr auto; place-items: center; padding: 6px 2px 7px; background: var(--line); --cut: 9px; transition: transform .12s ease; }
.lv::before { content: ""; position: absolute; inset: 2px; background: linear-gradient(180deg, var(--panel-2), var(--panel)); clip-path: inherit; }
.lv > * { position: relative; }
.lv b { font-family: var(--f-num); font-weight: 400; font-size: 30px; line-height: 1; color: var(--bone); }
.lv .stars { font-size: 11px; letter-spacing: 1px; color: #5d5486; }
.lv .stars em { font-style: normal; color: var(--gold); }
.lv[aria-selected="true"] { background: var(--gold); transform: translateY(-5px) scale(1.06); }
.lv[aria-selected="true"]::before { background: linear-gradient(180deg, #4a3c1a, #2a2010); }
.lv[aria-selected="true"] b { color: var(--gold); }
.lv.locked b { color: #5d5486; }
.lv.locked::after { content: ""; position: absolute; left: 50%; top: 36%; width: 16px; height: 13px; margin: 0 0 0 -8px; background: #5d5486; border-radius: 3px; box-shadow: 0 -9px 0 -4px var(--panel), 0 -9px 0 -1px #5d5486; }
.lv.locked b { opacity: 0; }
.lvinfo { width: 100%; max-width: 420px; text-align: center; min-height: 92px; padding: 10px 14px 12px; background: rgba(14, 10, 28, .72); --cut: 10px; }
.lvinfo h2 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: 28px; letter-spacing: .12em; text-indent: .12em; }
.lvinfo h2 small { font-family: var(--f-body); font-weight: 700; font-size: 12px; letter-spacing: .12em; vertical-align: middle; margin-left: 8px; padding: 2px 8px; color: var(--gold-ink); background: var(--gold); }
.lvinfo p { margin: 6px auto 0; max-width: 22em; color: #cfc8e6; font-size: 14px; line-height: 1.5; text-wrap: balance; }
.actions { width: 100%; max-width: 420px; display: grid; gap: 10px; }

<script>
(function () {

const TAU = Math.PI * 2;

const lerp = (a, b, t) => a + (b - a) * t;

// 戰場座標：x 橫向、z 縱深（0 = 我方城牆，L = 敵城城門）、y 高度
const L = 110;          // 戰場縱深
const WALLZ = 0;        // 我方城牆
const CANZ = -3.2;      // 兵砲所在

const RAD = 0.36;       // 小兵半徑

const CAN_LIM = PLAZA_HW - 2.4;

// 道路：中心線 cx(z) 與半寬 hw(z)，每 0.5 取樣
const ZMIN = -16, RDZ = 0.5;

      return lerp(a[1], b[1], smooth((z - a[0]) / (b[0] - a[0])));

}
function buildRoad(def) {
  for (let i = 0; i < RN; i++) {

function rcx(z) {

}
function rhw(z) {
  let f = (z - ZMIN) / RDZ;
  if (f < 0) f = 0; else if (f > RN - 1.001) f = RN - 1.001;
  const i = f | 0;
  return roadHw[i] + (roadHw[i + 1] - roadHw[i]) * (f - i);

const LANE_PAD = 0.5;
function laneX(t, z) { return rcx(z) + t * (rhw(z) - LANE_PAD); }

function tri(p) { p = p - Math.floor(p); return p < 0.5 ? p * 4 - 1 : 3 - p * 4; }

function fmt(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

/* ===== 15-view: 固定鏡頭的透視投影 =====

    AU.out = ctx.createGain(); AU.out.gain.value = 1.5; AU.out.connect(comp); comp.connect(ctx.destination);

function tone(f, dur, type, vol, f2, t0, dest, atk) {

function noise(dur, vol, type, f, f2, q, t0, dest) {

  s.buffer = AU.nbuf; s.loop = true; fl.type = type; fl.frequency.setValueAtTime(f, t); if (f2) fl.frequency.exponentialRampToValueAtTime(Math.max(30, f2), t + dur); fl.Q.value = q || 0.8;

function gap(name, ms) { const n = performance.now(); if (n - (AU.last[name] || 0) < ms) return true; AU.last[name] = n; return false; }

function sfx(name, arg) {

function mkRng(seed) { let s = seed >>> 0; return () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

function paintAbyss(c, T, rs) {

    for (let i = 0; i < N; i++) {
      const y = rs() * H, s = (0.35 + 0.9 * y / H) * u, x = rs() * W, w = (10 + rs() * 26) * s;
      c.strokeStyle = 'rgba(255,255,255,' + (0.10 + rs() * 0.2) + ')'; c.lineWidth = 1.6 * s;
      c.beginPath(); c.moveTo(x, y); c.quadraticCurveTo(x + w / 2, y - 3 * s, x + w, y); c.stroke();
    }
    for (let i = 0; i < 9; i++) { c.fillStyle = 'rgba(255,255,255,.10)'; ell(c, rs() * W, rs() * H, (40 + rs() * 60) * u, (10 + rs() * 12) * u); c.fill(); }
  } else if (T.sky === 'dune') {
    for (let i = 0; i < 90; i++) {

      c.strokeStyle = (rs() < 0.5 ? 'rgba(255,230,170,' : 'rgba(90,40,10,') + (0.10 + rs() * 0.14) + ')'; c.lineWidth = (2 + rs() * 3) * s;
      c.beginPath(); c.moveTo(x, y); c.bezierCurveTo(x + w * 0.3, y - 10 * s, x + w * 0.6, y + 10 * s, x + w, y - 2 * s); c.stroke();
    }
  } else if (T.sky === 'ice') {
    for (let i = 0; i < 70; i++) {
      const y = rs() * H, s = (0.4 + 0.9 * y / H) * u, x = rs() * W, r = (8 + rs() * 26) * s;
      c.beginPath(); for (let k = 0; k < 6; k++) { const a = k / 6 * TAU + rs() * 0.5, rr2 = r * (0.7 + rs() * 0.5); c.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2 * 0.5); } c.closePath();

      c.beginPath(); for (let k = 0; k < 7; k++) { const a = k / 7 * TAU + rs() * 0.4, rr2 = r * (0.65 + rs() * 0.5); c.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2 * 0.55); } c.closePath();
      c.fillStyle = 'rgba(38,14,8,' + (0.55 + rs() * 0.35) + ')'; c.fill();
    }
    for (let i = 0; i < 26; i++) { c.fillStyle = 'rgba(255,230,120,.16)'; ell(c, rs() * W, rs() * H, (20 + rs() * 50) * u, (8 + rs() * 16) * u); c.fill(); }
  } else {
    for (let i = 0; i < 16; i++) { const x = rs() * W, y = rs() * H, r = (60 + rs() * 120) * u; c.fillStyle = rg(c, x, y, 0, r, [0, (rs() < 0.5 ? 'rgba(170,70,220,' : 'rgba(230,60,140,') + '.20)', 1, 'rgba(120,40,200,0)']); c.fillRect(x - r, y - r, r * 2, r * 2); }
    for (let i = 0; i < 120; i++) { c.fillStyle = 'rgba(255,220,255,' + (0.2 + rs() * 0.5) + ')'; const s = (0.6 + rs() * 1.4) * u; c.fillRect(rs() * W, rs() * H, s, s); }
    for (let i = 0; i < 7; i++) {

function paintDeco(c, kind, x, y, s, rs) {
  // 岩柱頂上的小擺設，s = 該處每世界單位的像素

    poly(c, [x - 1.1 * s, y, x - 0.8 * s, y - 1.5 * s, x + 0.1 * s, y - 2.1 * s, x + 0.9 * s, y - 1.2 * s, x + 1.1 * s, y]); fs(c, '#d08a4a', '#6f3519', 0.12 * s);

    c.fillStyle = rg(c, x, y - 1.4 * s, 0, 2.6 * s, [0, 'rgba(255,90,230,.45)', 1, 'rgba(200,60,255,0)']); c.fillRect(x - 3 * s, y - 4.4 * s, 6 * s, 6 * s);
    poly(c, [x - 0.6 * s, y, x - 0.45 * s, y - 2.4 * s, x, y - 3 * s, x + 0.45 * s, y - 2.4 * s, x + 0.6 * s, y]); fs(c, '#2c2040', '#0e0818', 0.12 * s);
    c.strokeStyle = '#ff7af0'; c.lineWidth = 0.14 * s; c.beginPath(); c.moveTo(x, y - 2.3 * s); c.lineTo(x, y - 0.8 * s); c.moveTo(x - 0.25 * s, y - 1.7 * s); c.lineTo(x + 0.25 * s, y - 1.7 * s); c.stroke();
  }

function paintFort(c, T, ruined) {
  P(rcx(L), L); const X = PX, Y = PY, U = PS, ky = V.ky, half = rhw(L) + 1.5;
  const A = T.fort[0], B = T.fort[1], D = T.fort[2];
  const ink = 'rgba(10,6,14,.85)', lw = Math.max(1, 0.16 * U);
  // 主堡
  if (!ruined) {
    const kw = 7.5 * U, kh = 12.5 * U * ky;
    c.beginPath(); c.rect(X - kw, Y - kh, kw * 2, kh); fs(c, lg(c, 0, Y - kh, 0, Y, [0, B, 1, D]), ink, lw);
    for (let k = -3; k <= 3; k++) { const mx = X + k * 2.1 * U; c.beginPath(); c.rect(mx - 0.75 * U, Y - kh - 1.1 * U, 1.5 * U, 1.2 * U); fs(c, B, ink, lw); }
    poly(c, [X - 3.2 * U, Y - kh - 1 * U, X, Y - kh - 5.2 * U, X + 3.2 * U, Y - kh - 1 * U]); fs(c, '#b3221f', ink, lw);
    c.strokeStyle = '#5a3a20'; c.lineWidth = lw; c.beginPath(); c.moveTo(X, Y - kh - 5.2 * U); c.lineTo(X, Y - kh - 8 * U); c.stroke();

    for (const k of [-1, 1]) { c.fillStyle = 'rgba(255,170,60,.9)'; rrect(c, X + k * 3.4 * U - 0.6 * U, Y - kh * 0.72, 1.2 * U, 1.9 * U, 0.6 * U); c.fill(); }
  }
  // 城牆
  const wh = 6.4 * U * ky, x0 = X - half * U, x1 = X + half * U;
  if (ruined) {
    c.beginPath(); c.moveTo(x0, Y + 2); c.lineTo(x0, Y - wh);
    const step = (x1 - x0) / 26;
    for (let k = 1; k < 26; k++) { const xx = x0 + k * step, d = Math.abs(k - 13) / 13; const hh = wh * (0.25 + 0.75 * Math.min(1, d * 1.5)) * (0.75 + 0.5 * ((k * 7919) % 13) / 13); c.lineTo(xx, Y - Math.min(wh, hh)); }
    c.lineTo(x1, Y - wh); c.lineTo(x1, Y + 2); c.closePath(); fs(c, lg(c, 0, Y - wh, 0, Y, [0, B, 1, D]), ink, lw);
    c.fillStyle = 'rgba(0,0,0,.55)'; ell(c, X, Y - 0.6 * U, 6 * U, 2.2 * U); c.fill();
    for (let k = 0; k < 14; k++) { const xx = X + (((k * 37) % 17) - 8) * 0.9 * U, yy = Y - ((k * 53) % 7) * 0.25 * U; poly(c, [xx - 0.8 * U, yy, xx - 0.3 * U, yy - 0.9 * U, xx + 0.6 * U, yy - 0.7 * U, xx + 0.9 * U, yy]); fs(c, A, ink, lw * 0.7); }
    c.fillStyle = rg(c, X, Y - 2 * U, 0, 9 * U, [0, 'rgba(255,150,40,.55)', 1, 'rgba(255,90,20,0)']); c.fillRect(X - 9 * U, Y - 11 * U, 18 * U, 12 * U);

  c.strokeStyle = 'rgba(0,0,0,.16)'; c.lineWidth = lw * 0.6;
  for (let r = 1; r < 5; r++) { c.beginPath(); c.moveTo(x0, Y - wh * r / 5); c.lineTo(x1, Y - wh * r / 5); c.stroke(); }
  const nm = Math.floor((x1 - x0) / (1.9 * U));
  for (let k = 0; k <= nm; k++) { const mx = x0 + (x1 - x0) * k / nm; c.beginPath(); c.rect(mx - 0.55 * U, Y - wh - 1 * U, 1.1 * U, 1.1 * U); fs(c, A, ink, lw * 0.8); }
  // 塔樓
  for (const sd of [-1, 1]) {
    const tx = X + sd * 8.6 * U, tw = 2.9 * U, th = 10.6 * U * ky;
    c.beginPath(); c.rect(tx - tw, Y - th, tw * 2, th + 2); fs(c, lg(c, tx - tw, 0, tx + tw, 0, [0, D, 0.4, A, 1, B]), ink, lw);
    for (let k = -1; k <= 1; k++) { c.beginPath(); c.rect(tx + k * 2 * U - 0.7 * U, Y - th - 1.1 * U, 1.4 * U, 1.2 * U); fs(c, A, ink, lw * 0.8); }
    poly(c, [tx - tw * 1.05, Y - th - 1 * U, tx, Y - th - 5 * U, tx + tw * 1.05, Y - th - 1 * U]); fs(c, '#b3221f', ink, lw);
    c.fillStyle = 'rgba(255,170,60,.9)'; rrect(c, tx - 0.55 * U, Y - th * 0.7, 1.1 * U, 1.9 * U, 0.55 * U); c.fill();
    c.strokeStyle = '#5a3a20'; c.lineWidth = lw; c.beginPath(); c.moveTo(tx, Y - th - 5 * U); c.lineTo(tx, Y - th - 7.4 * U); c.stroke();
    poly(c, [tx, Y - th - 7.4 * U, tx + sd * 2.3 * U, Y - th - 6.7 * U, tx, Y - th - 5.9 * U]); fs(c, '#ee3b30', ink, lw * 0.7);

      c.strokeStyle = '#ffd9a0'; c.lineWidth = lw * 0.9; c.beginPath(); c.moveTo(bx - 0.5 * U, top + 1.1 * U); c.lineTo(bx, top + 2.1 * U); c.lineTo(bx + 0.5 * U, top + 1.1 * U); c.stroke();
    }

  // 城門
  const gw = 3.4 * U, gh = 5.2 * U * ky;
  c.fillStyle = rg(c, X, Y - gh * 0.4, 0, 8 * U, [0, 'rgba(255,90,50,.55)', 1, 'rgba(255,60,30,0)']); c.fillRect(X - 8 * U, Y - 9 * U, 16 * U, 10 * U);
  c.beginPath(); c.moveTo(X - gw, Y + 2); c.lineTo(X - gw, Y - gh * 0.55); c.quadraticCurveTo(X - gw, Y - gh, X, Y - gh); c.quadraticCurveTo(X + gw, Y - gh, X + gw, Y - gh * 0.55); c.lineTo(X + gw, Y + 2); c.closePath();

}

function renderTerrain(lv, ruined) {
  const W = V.W, H = V.H, T = THEMES[lv.theme], u = V.u, ky = V.ky;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const c = cv.getContext('2d'); c.lineJoin = 'round'; c.lineCap = 'round';
  const rs = mkRng(4242 + lv.theme * 99);
  paintAbyss(c, T, rs);

  // 道路邊緣取樣
  const n = RN, xl = new Float32Array(n), xr = new Float32Array(n), yy = new Float32Array(n), sc = new Float32Array(n);
  let iF = 0;
  for (let i = 0; i < n; i++) {
    const z = ZMIN + i * RDZ; P(roadCx[i], z); const hwp = roadHw[i] * PS;
    xl[i] = PX - hwp; xr[i] = PX + hwp; yy[i] = PY; sc[i] = PS;
    if (z <= L + 3.5) iF = i;
  }
  // 岩柱：先決定位置，之後跟懸崖一起由遠到近畫
  const pillars = [];
  for (let tries = 0; tries < 260 && pillars.length < 16; tries++) {
    const z = 4 + rs() * 92, r = 1.6 + rs() * 2.6, side = rs() < 0.5 ? -1 : 1;
    const edge = rcx(z) + side * (rhw(z) + 2.5 + r + rs() * 9);
    P(edge, z); if (PX < -r * PS * 0.3 || PX > W + r * PS * 0.3) continue;
    let ok = true;
    for (let dz = -r - 2; dz <= r + 2; dz += 1) { if (Math.abs(edge - rcx(z + dz)) < rhw(z + dz) + r + 1.5) { ok = false; break; } }
    for (const p of pillars) if (Math.abs(p.z - z) < 7 && Math.abs(p.x - edge) < p.r + r + 2) ok = false;
    if (ok) pillars.push({ x: edge, z, r, drop: rs() * 5, deco: rs() < 0.75 });
  }
  pillars.sort((a, b) => b.z - a.z);
  let pi = 0;
  const CH = 26;                       // 懸崖高度（世界單位）
  const drawPillar = (p) => {
    P(p.x, p.z); const s = PS, cy = PY + p.drop * s * ky, rx = p.r * s, ry = p.r * s * V.q0 * (PS / V.s0), h = CH * 0.8 * s;
    c.beginPath(); c.moveTo(p.x * 0 + PX - rx, cy); c.lineTo(PX - rx * 0.7, cy + h); c.lineTo(PX + rx * 0.7, cy + h); c.lineTo(PX + rx, cy); c.closePath();
    c.fillStyle = lg(c, 0, cy, 0, cy + h, [0, T.cliffT, 0.5, T.cliffB, 1, 'rgba(' + T.fade + ',0)']); c.fill();
    c.fillStyle = lg(c, PX - rx, 0, PX + rx, 0, [0, 'rgba(255,255,255,.14)', 0.5, 'rgba(0,0,0,0)', 1, 'rgba(0,0,0,.28)']); c.fill();
    ell(c, PX, cy, rx, ry); fs(c, T.rim, T.rimDk, Math.max(1, 0.12 * s));
    if (p.deco) paintDeco(c, T.deco, PX, cy, s, rs);
  };
  // 懸崖：由遠到近，一片一片往下掛
  for (let i = iF - 1; i >= 0; i--) {
    const z = ZMIN + i * RDZ;
    while (pi < pillars.length && pillars[pi].z >= z) drawPillar(pillars[pi++]);
    const fogT = clamp(z / L, 0, 1) * 0.35;

    for (let sd = 0; sd < 2; sd++) {

function fxStep(dt, rdt) {
  FX.time += rdt; FX.bodies = 0; FX.puffs = 0;
  // 殺敵速率（每秒）— 給音效與戰況條用
  FX.killRate += (FX.killsF / Math.max(rdt, 0.001) - FX.killRate) * Math.min(1, rdt * 6); FX.killsF = 0;
  if (FX.shake > 0.1) { const a = FX.shake * V.u; FX.shx = (R01() * 2 - 1) * a; FX.shy = (R01() * 2 - 1) * a; FX.shake *= Math.pow(0.0025, rdt); } else { FX.shake = 0; FX.shx = FX.shy = 0; }
  if (FX.flash > 0) FX.flash -= rdt * 2.6;
  if (FX.dark > 0) FX.dark -= rdt * (S.ult.active ? 0 : 0.9);
  if (FX.muzzle > 0) FX.muzzle -= rdt * 9;
  if (FX.wallFlash > 0) FX.wallFlash -= rdt * 3.5;
  if (FX.fortShake > 0) FX.fortShake -= rdt * 8;
  if (FX.redVig > 0) FX.redVig -= rdt * 1.5;
  FX.surge += ((S.surge.on > 0 && S.state === 'play' ? 1 : 0) - FX.surge) * Math.min(1, rdt * 4);
  // 烽火：一道火牆從城牆往前掃
  const bn = S.burn;
  if (bn.active && bn.zf < bn.z1) {
    for (let k = 0; k < (FX.low ? 7 : 13); k++) {
      const x = rnf(-PLAZA_HW, PLAZA_HW);
      pt(R01() < 0.5 ? SP_SOFT : SP_PUFF, x, bn.zf + rnf(-0.8, 0.8), rnf(0.2, 1.4), rnf(-1, 1), rnf(2, 6), rnf(3, 9), rnf(0.3, 0.55), rnf(1.4, 2.6), R01() < 0.6 ? rgba(255, 150, 30, 150) : rgba(255, 80, 20, 170), PF_ADD | PF_GROW, -4);
    }
    addShake(5);
  }
  if (FX.slowT > 0) { FX.slowT -= rdt; if (FX.slowT <= 0) FX.slow = 1; }
  // 粒子
  for (let i = pn - 1; i >= 0; i--) {
    const life = pLife[i] - dt;
    if (life <= 0) { const j = --pn; if (i !== j) { pSp[i] = pSp[j]; pX[i] = pX[j]; pZ[i] = pZ[j]; pY[i] = pY[j]; pVX[i] = pVX[j]; pVZ[i] = pVZ[j]; pVY[i] = pVY[j]; pLife[i] = pLife[j]; pMax[i] = pMax[j]; pSize[i] = pSize[j]; pCol[i] = pCol[j]; pFl[i] = pFl[j]; pGrav[i] = pGrav[j]; pRot[i] = pRot[j]; pVR[i] = pVR[j]; } continue; }
    pLife[i] = life;
    pVY[i] -= pGrav[i] * dt;
    pX[i] += pVX[i] * dt; pZ[i] += pVZ[i] * dt; pY[i] += pVY[i] * dt; pRot[i] += pVR[i] * dt;
    if (pY[i] < 0 && pGrav[i] > 0) {
      if (pFl[i] & PF_BOUNCE) { pY[i] = 0; pVY[i] *= -0.4; pVX[i] *= 0.6; pVZ[i] *= 0.6; pVR[i] *= 0.5; }
      else if (pFl[i] & PF_ARROW) {
        // 箭落地：插在地上停一下、揚一點塵
        pY[i] = 0; pVX[i] = pVZ[i] = pVY[i] = 0; pGrav[i] = 0; pFl[i] &= ~PF_ARROW; pLife[i] = pMax[i] = 0.4;
        if (R01() < 0.5) pt(SP_PUFF, pX[i], pZ[i], 0.3, 0, 0, 1.5, 0.25, 0.7, C_DUST, PF_GROW, 0);
      } else if (pFl[i] & PF_SOLID) { pY[i] = 0; pVY[i] *= -0.3; pVX[i] *= 0.5; pVZ[i] *= 0.5; pVR[i] *= 0.4; if (pLife[i] > 0.22) pLife[i] = 0.22; }
      else if (pLife[i] > 0.04) pLife[i] = 0.04;
    }
  }
  // 萬箭齊發的箭
  const u = S.ult;
  if (u.active) {
    const zw = lerp(u.z0, u.z1, Math.min(1, u.t / u.dur)), n = FX.low ? 7 : 16;
    for (let k = 0; k < n; k++) {
      const z = zw + rnf(-1, 7), x = rcx(z) + rnf(-1, 1) * rhw(z), T = 0.3;
      pt(SP_ARROW, x + 2.2, z - 6, 17, -2.2 / T, 6 / T, -17 / T, T + 0.02, 3.3, C_WHITE, PF_ARROW, 0.01, 0.18);
    }
    if ((S.frame & 3) === 0) addShake(4);
  }
  // 倍增門的累計浮字
  if ((S.frame % 30) === 0 && FX.gateAcc.size) {
    for (const [g, nAcc] of FX.gateAcc) { if (nAcc > 0) floatText('+' + nAcc, g.x + g.w * 0.5 + 0.6, g.z, 3.2, g.kind === 2 ? 2.4 : 1.6, g.kind === 2 ? C_GOLD : rgba(150, 215, 255, 255), 0.55); }
    FX.gateAcc.clear();
  }
  const fl = FX.floats;
  for (let i = fl.length - 1; i >= 0; i--) { const f = fl[i]; f.life -= rdt; f.y += rdt * 4.5; if (f.life <= 0) fl.splice(i, 1); }
}

/* ===== 65-bot: 自動玩家。主畫面背景的示範戰局用它，Node 裡估難度也用它 ===== */
function botOvl(a0, a1, b0, b1) { return Math.max(0, Math.min(a1, b1) - Math.max(a0, b0)); }
function botGateX(g, t) { return g.amp ? g.x0 + g.amp * tri((t - g.born) / g.per + g.ph) : g.x; }
// 從 x 位置開砲，一個兵平均會變成幾個
function botMult(x) {
  const gs = S.gates.filter((g) => g.alive).sort((a, b) => a.z - b.z);
  let M = 1, s = 0.15; const c = x;
  for (const g of gs) {
    const gx = botGateX(g, S.time + (g.z - CANZ) / BSPD);
    const f = botOvl(c - s, c + s, gx - g.w / 2, gx + g.w / 2) / (2 * s);
    if (f <= 0) continue;
    M = M * (1 - f) + M * f * g.m;
    if (g.m > 1 && f > 0.3) s = Math.max(s, (0.7 + 0.65 * Math.sqrt(g.m)) * 0.8);

}
function makeBot(skill, rand) {
  const st = { tx: 0, next: 0, ultWait: -1 }, rf = rand || Math.random;

      : skill === 'weak' ? { iv: 1.4, noise: 2.4, spd: 11, ultDelay: 5 } : null;
  return function (dt) {
    if (!Pm) return;
    if (S.time >= st.next) {
      st.next = S.time + Pm.iv;
      let best = -1, bx = 0;
      for (let x = -CAN_LIM; x <= CAN_LIM; x += 0.5) {
        const v = botMult(x) - Math.abs(x - S.cannonX) * 0.01;
        if (v > best) { best = v; bx = x; }
      }
      // 戰線夠遠、沒有總攻的時候才分兵去蓋砲塔
      if (S.time > 4 && S.surge.on <= 0) {
        for (const p of S.peds) {
          if (!p.built && S.front > (skill === 'good' ? 32 : 36) && (skill === 'good' || S.time % 9 < 4.5)) { bx = clamp(p.x, -CAN_LIM, CAN_LIM); break; }
        }
      }
      // 很會玩的才會回頭補掉零星漏網的
      if (skill === 'good' && S.redMinZ < 7) {
        const r = S.R; let lx = 0, lz = 1e9, cnt = 0;
        for (let j = 0; j < r.n; j++) if (r.hp[j] > 0 && r.z[j] < 9) { cnt++; if (r.z[j] < lz) { lz = r.z[j]; lx = r.x[j]; } }
        if (cnt > 0 && cnt <= 8) bx = clamp(lx, -CAN_LIM, CAN_LIM);
      }
      st.tx = clamp(bx + (rf() * 2 - 1) * Pm.noise, -CAN_LIM, CAN_LIM);
    }
    const d = st.tx - S.cannonX, m = Pm.spd * dt;
    S.cannonX += clamp(d, -m, m);
    const u = S.ult;
    if (u.charge >= u.need && !u.active) {
      if (st.ultWait < 0) st.ultWait = Pm.ultDelay;
      st.ultWait -= dt;
      if (st.ultWait <= 0 && (S.front < 70 || S.boss)) { simUlt(); st.ultWait = -1; }
    }
  };
}

    const r2 = r * (1.6 - 0.6 * f);

  const nb = B.n, nr = R.n;
  for (let i = 0; i < nb; i++) { let b = ((ZTOP - B.z[i]) * BK) | 0; if (b < 0) b = 0; else if (b >= NBK) b = NBK - 1; bkB[i] = b; ordCnt[b + 1]++; }
  for (let j = 0; j < nr; j++) { let b = ((ZTOP - R.z[j]) * BK) | 0; if (b < 0) b = 0; else if (b >= NBK) b = NBK - 1; bkR[j] = b; ordCnt[b + 1]++; }
  for (let b = 0; b < NBK; b++) ordCnt[b + 1] += ordCnt[b];
  ordCur.set(ordCnt);
  for (let j = 0; j < nr; j++) ord[ordCur[bkR[j]]++] = ~j;
  for (let i = 0; i < nb; i++) ord[ordCur[bkB[i]]++] = i;

  for (const p of S.proj) {

  /* 浮字 */
  for (const f of FX.floats) {

  }

  }

  /* 全畫面效果 */
  if (FX.dark > 0.01) rect(-40, -40, W + 80, H + 80, rgba(8, 4, 20, Math.min(1, FX.dark) * 90), 0);
  if (FX.surge > 0.01) { const s = A.soft, a = FX.surge * (0.34 + 0.1 * Math.sin(FX.time * 8)); quad(-W * 0.6, -H * 0.42, W * 1.6, H * 0.5, s.u0, s.v0, s.u1, s.v1, rgba(255, 40, 20, 255 * a), 0); }

  }

  frameEnd();
}

/* ===== 85-main: 啟動、主迴圈、操作、關卡流程 ===== */
const STEP = 1 / 60;
const G = {
  mode: 'home', demo: true, bot: null, acc: 0, last: 0, endT: 0, drag: null, moved: 0, keys: {}, dprCap: 2, stageW: 1,
  ft: 16, slowFrames: 0, hudN: 0, lastKills: -1, lastWall: -1, mileIdx: 0, demoIdx: 0, demoWait: 0, started: false, bossBar: false
};
const MILES = [[100, '百人斬'], [500, '五百人斬'], [1000, '千人斬'], [2000, '兩千人斬'], [3500, '所向披靡'], [5000, '五千人斬'], [8000, '萬夫莫敵'], [12000, '橫掃千軍']];

function layout() {
  const app = $('app'), stage = $('stage'), w = app.clientWidth, h = app.clientHeight;
  if (!w || !h) return;
  let sw = w; if (h / w < 1.5) sw = Math.round(h / 1.74);
  stage.style.width = sw + 'px'; G.stageW = sw;
  const rot = h < 430 && w > h; $('rotate').hidden = !rot; if (rot && G.mode === 'play' && S.state === 'play') pauseGame();
  const dpr = Math.min(window.devicePixelRatio || 1, G.dprCap);
  let W = Math.round(sw * dpr), H = Math.round(h * dpr);
  if (W > 900) { H = Math.round(H * 900 / W); W = 900; }
  if (W !== V.W || H !== V.H) { setView(W, H, W / sw); glResize(W, H); if (S.lv) rebuildTerrain(); }
}
const terrCache = { key: '', a: null, b: null };
function rebuildTerrain() {
  if (V.W < 2 || V.H < 2) return;
  const key = S.idx + '|' + V.W + '|' + V.H;
  if (terrCache.key !== key) { terrCache.key = key; terrCache.a = renderTerrain(S.lv, false); terrCache.b = renderTerrain(S.lv, true); }
  glSetBg(terrCache.a, terrCache.b);
}

function demoStart(idx) {
  G.demo = true; G.demoIdx = idx; G.demoWait = 0;
  simInit(idx, { rate: 3, armor: 3, hero: 3, ult: 3, wall: 5 }, (Math.random() * 1e9) | 0, 1); fxReset(); rebuildTerrain();
  G.bot = makeBot('casual'); S.on = fxOn;
}
function startLevel(idx) {
  auInit();
  G.demo = false; G.mode = 'play'; G.endT = 0; G.acc = 0; G.moved = 0; G.mileIdx = 0; G.lastKills = -1; G.lastWall = -1; G.bossBar = false;
  $('tug').classList.remove('boss'); $('tugRl').textContent = '赤潮';
  const run = G.run = (G.run || 0) + 1;
  simInit(idx, SV.up, (Math.random() * 1e9) | 0, SV.diff); fxReset(); rebuildTerrain(); S.on = fxOn; G.ultHint = false;
  $('home').hidden = true; $('result').hidden = true; $('opt').hidden = true; $('shop').hidden = true; $('hud').hidden = false;
  $('hudNo').textContent = '第' + NUM_ZH[idx] + '關'; $('hudName').textContent = LEVELS[idx].name;
  $('hint').hidden = !(idx === 0 && !SV.seen);
  $('banner').className = ''; $('say').className = 'chamfer'; $('mile').className = '';
  setTimeout(() => { if (G.mode === 'play' && G.run === run) { const el = $('banner'); el.className = 'blue'; el.innerHTML = ''; const s = document.createElement('small'); s.textContent = '第' + NUM_ZH[idx] + '關'; el.appendChild(s); el.appendChild(document.createTextNode(LEVELS[idx].name)); replay(el, 'show'); } }, 60);
  setTimeout(() => { if (G.mode === 'play' && G.run === run && S.time < 6) say(LEVELS[idx].tip); }, 1900);
  musStart(LEVELS[idx].theme, false);
  hudUpdate(true);
}
function goHome() {
  G.run = (G.run || 0) + 1;
  G.mode = 'home'; $('hud').hidden = true; $('result').hidden = true; $('opt').hidden = true; $('shop').hidden = true; $('home').hidden = false;
  homeRender(); demoStart(UI.sel); musStart(0, true);
}
function pauseGame() { if (G.mode !== 'play' || S.state !== 'play') return; G.mode = 'pause'; G.drag = null; G.keys = {}; openOpt(true); }
function resumeGame() { if (G.mode !== 'pause') return; G.mode = 'play'; $('opt').hidden = true; G.last = performance.now(); }
function finishLevel() {
  const won = S.state === 'won', idx = S.idx;
  const ratio = S.wallHp / S.wallMax, stars = won ? (ratio >= 0.8 ? 3 : ratio >= 0.4 ? 2 : 1) : 0;
  let coins = Math.floor(S.kills / (won ? 30 : 50)) + S.coinsBig;
  if (SV.diff === 2) coins = Math.round(coins * 1.25);
  if (won) { coins += 60 + 30 * idx + Math.max(0, stars - SV.stars[idx]) * 25; SV.stars[idx] = Math.max(SV.stars[idx], stars); SV.open = Math.max(SV.open, Math.min(5, idx + 2)); }
  SV.coins += coins; SV.kills += S.kills; SV.seen = true; save();
  G.mode = 'result'; musStop(); sfx(won ? 'win' : 'lose');
  showResult(won, { idx, stars, kills: S.kills, army: S.maxArmy, lost: S.lost, time: S.time, coins });
}

function setTrack(el, f) { el.style.transform = 'scaleX(' + clamp(f, 0, 1).toFixed(3) + ')'; }
function hudUpdate(force) {
  G.hudN++;
  if (S.kills !== G.lastKills) {
    const el = $('hudKills'); el.textContent = fmt(S.kills);
    if (S.kills - G.lastKills > 24 || force) replay(el, 'pop');
    G.lastKills = S.kills;
    while (G.mileIdx < MILES.length && S.kills >= MILES[G.mileIdx][0]) { if (!force) mile(MILES[G.mileIdx][1]); G.mileIdx++; }
  }
  if (S.wallHp !== G.lastWall) {
    G.lastWall = S.wallHp; $('wallNum').textContent = Math.max(0, Math.ceil(S.wallHp));
    setTrack($('wallBar'), S.wallHp / S.wallMax); $('wallBar').classList.toggle('warn', S.wallHp < S.wallMax * 0.4);
  }
  if (force || G.hudN % 4 === 0) {
    $('tugB').textContent = fmt(S.B.n);
    const boss = S.boss;
    if (!!boss !== G.bossBar) { G.bossBar = !!boss; $('tug').classList.toggle('boss', G.bossBar); $('tugRl').textContent = boss ? '魔王' : '赤潮'; }
    if (boss) { $('tugR').textContent = fmt(Math.ceil(boss.hp)); setTrack($('tugBar'), boss.hp / boss.maxHp); }
    else { $('tugR').textContent = fmt(S.R.n); setTrack($('tugBar'), S.state === 'won' ? 1 : clamp(S.front / L, 0.02, 1)); }
    const h = S.hero, hm = $('heroMeter');
    hm.hidden = !h.on; if (h.on) { const f = h.ready > 0 ? 1 : h.t / h.cd; setTrack($('heroBar'), f); $('heroNum').textContent = h.ready > 0 ? '出陣' : Math.max(0, Math.ceil(h.cd - h.t)) + '秒'; hm.classList.toggle('ready', h.ready > 0); }
    const u = S.ult, p = clamp(u.charge / u.need, 0, 1), btn = $('btnUlt');
    btn.style.setProperty('--p', p.toFixed(3)); btn.classList.toggle('ready', p >= 1 && !u.active);
    if (p >= 1 && !u.active && !SV.ultSeen && !G.ultHint && S.state === 'play') { G.ultHint = true; say('箭雨集滿了！按右下角的金色按鈕', 0); }
    $('ultNum').textContent = p >= 1 ? '發射' : Math.floor(p * 100) + '%';
  }
}

function frame(now) {
  requestAnimationFrame(frame);
  let rdt = (now - G.last) / 1000; G.last = now;
  if (!(rdt > 0)) rdt = STEP; if (rdt > 0.1) rdt = 0.1;
  // 太慢就降特效、再不行降解析度
  G.ft += (rdt * 1000 - G.ft) * 0.05;
  if (G.ft > 40 && G.started) { if (++G.slowFrames > 150) { G.slowFrames = 0; if (!FX.low) FX.low = true; else if (G.dprCap > 1) { G.dprCap = Math.max(1, G.dprCap - 0.5); layout(); } } } else G.slowFrames = 0;
  AU.quiet = G.demo;
  const run = (G.mode === 'play' || (G.demo && G.mode !== 'pause')) && !G.freeze;
  if (run) {
    let ts = FX.slow; if (FX.stop > 0) { FX.stop -= rdt; ts = 0; }
    if (G.mode === 'play' && S.state === 'play') {
      const k = G.keys; let dx = 0; if (k.ArrowLeft || k.KeyA) dx -= 1; if (k.ArrowRight || k.KeyD) dx += 1;
      if (dx) { S.cannonX = clamp(S.cannonX + dx * 19 * rdt, -CAN_LIM, CAN_LIM); G.moved += 3; if (G.moved > 70 && !$('hint').hidden) $('hint').hidden = true; }
    }
    G.acc += rdt * ts; let n = 0;
    while (G.acc >= STEP && n < 4) { if (G.demo && S.state === 'play') G.bot(STEP); simStep(STEP); G.acc -= STEP; n++; }
    if (n === 4) G.acc = 0;
    fxStep(rdt * ts, rdt);
    if (G.mode === 'play') {
      hudUpdate(false);
      if (S.state !== 'play') { G.endT += rdt; if (G.endT > (S.state === 'won' ? 3.2 : 2.4)) finishLevel(); }
    } else if (G.demo && S.state !== 'play') { G.demoWait += rdt; if (G.demoWait > 3.5) demoStart(G.demoIdx); }
  }
  renderFrame();
  const heat = S.state === 'play' && G.mode === 'play' ? clamp(1 - S.front / 60, 0, 1) * 0.6 + (S.boss ? 0.5 : 0) + Math.min(0.4, FX.killRate / 900) : 0;
  auStep(rdt, FX.killRate, run && !G.demo); musStep(Math.min(1, heat));
}

function bindInput() {
  const stage = $('stage');
  const absX = (clientX) => { const r = stage.getBoundingClientRect(); return clamp(worldXAt((clientX - r.left) * V.W / r.width, CANZ), -CAN_LIM, CAN_LIM); };
  stage.addEventListener('pointerdown', (e) => {
    auInit(); if (!G.started) { G.started = true; if (G.mode === 'home') musStart(0, true); }
    if (G.mode !== 'play' || e.target.closest('button')) return;
    // 拖曳中的第二根手指不搶控制權（除非原本那根已經超過兩秒沒動靜，多半是事件漏掉了）
    if (G.drag && G.drag.id !== e.pointerId && e.pointerType !== 'mouse' && performance.now() - G.drag.at < 2000) return;
    G.drag = { id: e.pointerId, x: e.clientX, at: performance.now() };
    try { stage.setPointerCapture(e.pointerId); } catch (err) { /* 沒有指標捕捉也能玩 */ }
    if (e.pointerType === 'mouse') S.cannonX = absX(e.clientX);
    e.preventDefault();
  });
  stage.addEventListener('pointermove', (e) => {
    if (G.mode !== 'play' || S.state !== 'play') return;
    if (e.pointerType === 'mouse') { if (e.target.closest && e.target.closest('button')) return; S.cannonX = absX(e.clientX); G.moved += 4; }
    else if (G.drag && G.drag.id === e.pointerId) {
      const dx = e.clientX - G.drag.x; G.drag.x = e.clientX; G.drag.at = performance.now(); G.moved += Math.abs(dx);
      S.cannonX = clamp(S.cannonX + dx * (V.W / G.stageW) * (1 + CANZ * V.g) / V.s0 * 1.25, -CAN_LIM, CAN_LIM);
    }
    if (G.moved > 70 && !$('hint').hidden) $('hint').hidden = true;
  });
  const up = (e) => { if (G.drag && G.drag.id === e.pointerId) G.drag = null; };
  stage.addEventListener('pointerup', up); stage.addEventListener('pointercancel', up); stage.addEventListener('lostpointercapture', up);
  stage.addEventListener('contextmenu', (e) => e.preventDefault());
  window.addEventListener('keydown', (e) => {
    G.keys[e.code] = true;
    if (e.repeat) return;
    const pk = e.code === 'KeyP' || e.code === 'Escape';
    if (G.mode === 'play') { if (e.code === 'Space' || e.code === 'Enter') { if (e.target.closest && e.target.closest('button')) return; if (simUlt()) SV.ultSeen = true; e.preventDefault(); } else if (pk) pauseGame(); }
    else if (G.mode === 'pause' && pk) resumeGame();
  });
  window.addEventListener('keyup', (e) => { G.keys[e.code] = false; });
  window.addEventListener('blur', () => { G.keys = {}; });
  document.addEventListener('visibilitychange', () => { if (document.hidden) { if (G.mode === 'play' && S.state === 'play') pauseGame(); if (AU.ctx) AU.ctx.suspend(); } else if (AU.ctx) AU.ctx.resume(); });
  window.addEventListener('resize', layout);
  if (window.ResizeObserver) new ResizeObserver(layout).observe($('app'));

  const click = (id, fn) => $(id).addEventListener('click', (e) => { auInit(); fn(e); });
  click('btnUlt', () => { if (simUlt()) { if (!SV.ultSeen) { SV.ultSeen = true; save(); } } else sfx('deny'); });
  click('btnPause', () => { sfx('click'); pauseGame(); });
  click('btnGo', () => { sfx('click'); startLevel(UI.sel); });
  click('btnShop', () => { sfx('click'); shopRender(); $('shop').hidden = false; });
  click('btnOpt', () => { sfx('click'); openOpt(false); });
  click('btnResume', () => { sfx('click'); resumeGame(); });
  click('btnRetry', () => { sfx('click'); startLevel(S.idx); });
  click('btnQuit', () => { sfx('click'); goHome(); });
  click('btnNext', () => { sfx('click'); UI.sel = Math.min(4, S.idx + 1); startLevel(UI.sel); });
  click('btnAgain', () => { sfx('click'); startLevel(S.idx); });
  click('btnUp', () => { sfx('click'); shopRender(); $('shop').hidden = false; });
  click('btnHome', () => { sfx('click'); UI.sel = Math.min(S.state === 'won' ? S.idx + 1 : S.idx, SV.open - 1, 4); goHome(); });
  click('tSfx', () => { SV.sfx = !SV.sfx; toggleSync(); save(); sfx('click'); });
  click('tMus', () => { SV.mus = !SV.mus; toggleSync(); save(); sfx('click'); });
  click('tVib', () => { SV.vib = !SV.vib; toggleSync(); save(); vibrate(30); sfx('click'); });
  document.querySelectorAll('#diffSeg button').forEach((b) => b.addEventListener('click', () => { auInit(); SV.diff = +b.dataset.d; toggleSync(); save(); sfx('click'); }));
  click('btnUnlock', () => { SV.open = 5; save(); sfx('buy'); homeRender(); $('opt').hidden = true; });
  click('btnWipe', () => {
    if (!UI.wipeArm) { UI.wipeArm = 1; $('btnWipe').textContent = '再按一次，確定清除'; sfx('deny'); return; }
    SV.coins = 0; SV.open = 1; SV.kills = 0; SV.seen = false; SV.stars = [0, 0, 0, 0, 0]; for (const k in SV.up) SV.up[k] = 0;
    save(); UI.sel = 0; homeRender(); demoStart(0); $('opt').hidden = true; sfx('click');
  });
  document.querySelectorAll('[data-close]').forEach((b) => b.addEventListener('click', () => { sfx('click'); b.closest('.modal').hidden = true; if (G.mode === 'home') homeRender(); }));
}

function boot() {
  loadSave(); toggleSync();
  UI.sel = clamp(SV.open - 1, 0, 4);
  const cv = $('cv');
  const force2d = /(^|[#&])2d\b/.test(location.hash);
  glInit(cv, force2d);
  if (GLR.mode === 'gl') {
    cv.addEventListener('webglcontextlost', (e) => { e.preventDefault(); });
    cv.addEventListener('webglcontextrestored', () => { GLR.texAtlas = GLR.texBg = GLR.texBg2 = null; glInit(GLR.cv, false); glSetAtlas(AT.cv); if (S.lv) rebuildTerrain(); });
  }
  buildAtlas(); glSetAtlas(AT.cv); renderInit();
  bindInput(); layout(); homeRender(); demoStart(UI.sel);
  G.last = performance.now(); requestAnimationFrame(frame);
  // 數字字型晚一點才載到的話，重畫一次圖集
  if (document.fonts && document.fonts.load) {
    document.fonts.load('84px "Lilita One"').then((f) => { if (f && f.length) { buildAtlas(); glSetAtlas(AT.cv); renderInit(); } }).catch(() => { });
  }
}
window.__wj = { S, FX, G, V, SV, AU, sfx, musStart, musStep, auStep, startLevel, goHome, simUlt, makeBot, GLR, layout, simStep, fxStep, renderFrame,
  // 測試用：凍結即時迴圈後，手動把戰局往前推 sec 秒
  advance(sec, bot) { const n = Math.round(sec / STEP); for (let i = 0; i < n; i++) { if (bot && S.state === 'play') bot(STEP); simStep(STEP); fxStep(STEP, STEP); if (G.mode === 'play' && S.state !== 'play') G.endT += STEP; } if (G.mode === 'play') hudUpdate(true); }
};
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();

/* ===== 90-web: 只有公開網頁 App 版才有的東西 — 分享、安裝到主畫面、離線快取 ===== */
(function webExtras() {
  const ua = navigator.userAgent || '';
  const isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const inApp = /Line\/|FBAN|FBAV|Instagram|MicroMessenger/i.test(ua);
  const standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  const shareUrl = location.origin + location.pathname + '?openExternalBrowser=1';   // LINE 看到這個參數會改用手機瀏覽器開
  let deferred = null;

  const row = document.createElement('div'); row.className = 'row';
  row.innerHTML = '<button id="btnShare" class="btn"><span>分享給朋友</span></button><button id="btnInstall" class="btn"><span>安裝到主畫面</span></button>';
  document.querySelector('#home .actions').appendChild(row);
  if (standalone) { $('btnInstall').hidden = true; row.style.gridTemplateColumns = '1fr'; }

  const how = document.createElement('div'); how.id = 'how'; how.className = 'modal'; how.hidden = true;
  how.innerHTML = '<div class="plaque chamfer"><h2>安裝</h2><p class="tipline" id="howText"></p><button class="btn" id="howClose"><span>知道了</span></button></div>';
  $('stage').appendChild(how);
  how.style.zIndex = 8;
  $('howClose').addEventListener('click', () => { sfx('click'); how.hidden = true; });

  function toast(msg) { $('liTip').textContent = msg; }

  $('btnShare').addEventListener('click', async () => {
    auInit(); sfx('click');
    const data = { title: '萬軍破陣', text: '一砲轟出千軍萬馬！手機點開就能玩：', url: shareUrl };
    try { if (navigator.share) { await navigator.share(data); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
    try { await navigator.clipboard.writeText(shareUrl); toast('連結已複製，貼給朋友就能玩。'); }
    catch (e) { toast('把這個網址傳給朋友：' + shareUrl); }
  });

  window.addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); deferred = e; });
  window.addEventListener('appinstalled', () => { $('btnInstall').hidden = true; row.style.gridTemplateColumns = '1fr'; });
  $('btnInstall').addEventListener('click', async () => {
    auInit(); sfx('click');
    if (deferred) { deferred.prompt(); try { await deferred.userChoice; } catch (e) { /* 使用者關掉了 */ } deferred = null; return; }
    $('howText').textContent = inApp ? '這個 App 內建的瀏覽器不能安裝。請先點右上角選單，選「用預設瀏覽器開啟」，再回來按安裝。'
      : isIOS ? '在 Safari 點下方的「分享」按鈕，往下找到「加入主畫面」，就會多一個像 App 的圖示。'
        : '請打開瀏覽器的選單，選「安裝應用程式」或「加到主畫面」。';
    how.hidden = false;
  });

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* 沒有離線快取也能玩 */ }); });
  }
})();

})();
</script>

<style>
/* 版面：直向戰場佔滿整個舞台；選單是蓋在戰場上的切角軍牌，金線描邊。 */
@font-face { font-family: "NumFB"; font-weight: 400; src: local("Arial Black"), local("Arial-Black"), local("Roboto Black"), local("Roboto-Black"), local("HelveticaNeue-CondensedBlack"), local("DejaVu Sans Bold"), local("DejaVuSans-Bold"), local("Arial Bold"), local("Arial-BoldMT"); }
:root {
  color-scheme: dark;
  --ink: #120f1c; --panel: #1d1830; --panel-2: #2b2446; --line: #51457c;
  --bone: #f6eeda; --mute: #aea6c8;
  --blue: #3d86ff; --blue-deep: #1b46b8; --red: #ee3b30; --red-deep: #8f1418;
  --gold: #ffc93c; --gold-lt: #fff0b0; --gold-deep: #b9790f; --gold-ink: #3a2203;
  --f-display: "Noto Serif TC", "Songti TC", "Source Han Serif TC", "PMingLiU", serif;
  --f-num: "Lilita One", "NumFB", system-ui, sans-serif;
  --f-body: "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  --cut: 10px;
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; overflow: hidden; background: var(--ink); }
body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--bone); font-family: var(--f-body); font-size: 15px; overflow: hidden;
  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; border: 0; background: none; padding: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--gold-lt); outline-offset: 2px; }
#app { position: relative; height: 100%; display: flex; justify-content: center; overflow: hidden;
  background: radial-gradient(120% 80% at 50% 0%, #2a2146 0%, var(--ink) 70%); }
#stage { position: relative; height: 100%; width: 100%; overflow: hidden; background: #0d1019; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.chamfer { clip-path: polygon(var(--cut) 0, calc(100% - var(--cut)) 0, 100% var(--cut), 100% calc(100% - var(--cut)), calc(100% - var(--cut)) 100%, var(--cut) 100%, 0 calc(100% - var(--cut)), 0 var(--cut)); }

/* ---------- 戰鬥中的資訊列 ---------- */
#hud { position: absolute; inset: 0; pointer-events: none; }
.hud-top { position: absolute; left: 0; right: 0; top: 0; padding: 8px 12px 14px; display: grid; grid-template-columns: auto 1fr auto; gap: 6px 10px; align-items: center;
  background: linear-gradient(180deg, rgba(14, 10, 26, .82), rgba(14, 10, 26, .5) 70%, rgba(14, 10, 26, 0)); }
#btnPause { pointer-events: auto; width: 40px; height: 40px; display: grid; place-items: center; background: rgba(255, 255, 255, .1); --cut: 8px; }
#btnPause i { display: block; width: 14px; height: 15px; border-left: 5px solid var(--bone); border-right: 5px solid var(--bone); box-sizing: border-box; }
.hud-lv { min-width: 0; line-height: 1.15; }
.hud-lv small { display: block; font-size: 11px; letter-spacing: .12em; color: var(--mute); }
.hud-lv b { font-family: var(--f-display); font-weight: 900; font-size: 19px; letter-spacing: .06em; }
.hud-kills { text-align: right; line-height: 1.05; }
.hud-kills small { display: block; font-size: 11px; letter-spacing: .12em; color: var(--mute); }
.hud-kills b { font-family: var(--f-num); font-weight: 400; font-size: 26px; color: var(--gold); text-shadow: 0 2px 0 #3a2203; font-variant-numeric: tabular-nums; display: inline-block; transform-origin: 100% 60%; }
.hud-kills b.pop { animation: pop .18s ease-out; }
@keyframes pop { 0% { transform: scale(1.28); } 100% { transform: scale(1); } }
.tug { grid-column: 1 / -1; display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; font-family: var(--f-num); font-size: 15px; font-variant-numeric: tabular-nums; }
.tug span:first-child { color: #8fbfff; } .tug span:last-child { color: #ff9a8a; }
.tug span small { font-family: var(--f-body); font-size: 11px; letter-spacing: .1em; margin: 0 4px 0 0; opacity: .85; }
.tug span:last-child small { margin: 0 0 0 4px; }
.tug.boss .track { background: #2a0810; } .tug.boss .track i { background: linear-gradient(180deg, #ff7a5c, #c41e1e); } .tug.boss .track::after { display: none; }
.tug .track { height: 10px; background: var(--red); position: relative; overflow: hidden; --cut: 4px; box-shadow: 0 0 0 2px rgba(10, 6, 20, .8); }
.tug .track i { position: absolute; inset: 0; background: linear-gradient(180deg, #7fb8ff, var(--blue)); transform-origin: 0 50%; transform: scaleX(.5); }
.tug .track::after { content: ""; position: absolute; left: 50%; top: -2px; bottom: -2px; width: 2px; background: rgba(255, 255, 255, .55); }
.hud-bot { position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 12px 10px; display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: end;
  background: linear-gradient(0deg, rgba(14, 10, 26, .78), rgba(14, 10, 26, 0)); }
.meters { display: grid; gap: 6px; min-width: 0; }
.meter { display: grid; grid-template-columns: 2.6em 1fr 3.9em; gap: 8px; align-items: center; font-size: 12px; letter-spacing: .08em; color: var(--mute); }
.meter b { font-family: var(--f-num); font-weight: 400; font-size: 15px; color: var(--bone); font-variant-numeric: tabular-nums; letter-spacing: 0; white-space: nowrap; }
.meter .track { height: 11px; background: rgba(255, 255, 255, .13); position: relative; overflow: hidden; --cut: 4px; }
.meter .track i { position: absolute; inset: 0; transform-origin: 0 50%; }
#wallBar { background: linear-gradient(180deg, #9be28a, #3fae4e); }
#wallBar.warn { background: linear-gradient(180deg, #ffb37a, #ee3b30); }
#wallBar.road { background: linear-gradient(180deg, #a9d4ff, #3d86ff); }
#heroBar { background: linear-gradient(180deg, var(--gold-lt), var(--gold)); }
.meter.ready b { color: var(--gold); }
#btnUlt { pointer-events: auto; position: relative; width: 78px; height: 78px; border-radius: 50%; display: grid; place-items: center;
  background: conic-gradient(var(--gold) calc(var(--p, 0) * 1turn), rgba(255, 255, 255, .14) 0); filter: drop-shadow(0 3px 0 rgba(0, 0, 0, .5)); }
#btnUlt::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; background: radial-gradient(circle at 50% 35%, #3b3260, #191428); }
#btnUlt span { position: relative; font-family: var(--f-display); font-weight: 900; font-size: 19px; letter-spacing: .08em; color: var(--mute); line-height: 1.05; text-align: center; }
#btnUlt small { display: block; font-family: var(--f-num); font-size: 12px; letter-spacing: 0; color: var(--mute); }
#btnUlt.ready { animation: ult 0.7s ease-in-out infinite alternate; }
#btnUlt.ready::before { background: radial-gradient(circle at 50% 35%, #fff0b0, #ffb81f 60%, #b9790f); }
#btnUlt.ready span, #btnUlt.ready small { color: var(--gold-ink); }
@keyframes ult { from { transform: scale(1); filter: drop-shadow(0 0 0 rgba(255, 200, 60, 0)) drop-shadow(0 3px 0 rgba(0, 0, 0, .5)); } to { transform: scale(1.08); filter: drop-shadow(0 0 14px rgba(255, 200, 60, .9)) drop-shadow(0 3px 0 rgba(0, 0, 0, .5)); } }

#banner { position: absolute; left: 0; right: 0; top: 30%; text-align: center; font-family: var(--f-display); font-weight: 900; font-size: clamp(34px, 11vmin, 58px); letter-spacing: .1em; line-height: 1.1;
  padding: 10px 16px; opacity: 0; text-wrap: balance; }
#banner.show { animation: banner 1.7s cubic-bezier(.2, .9, .3, 1) both; }
#banner small { display: block; font-family: var(--f-num); font-size: .34em; letter-spacing: .3em; margin-bottom: 2px; }
#banner.gold { color: var(--gold); text-shadow: 0 3px 0 #3a2203, 0 0 22px rgba(255, 190, 40, .7); }
#banner.red { color: #ff6a55; text-shadow: 0 3px 0 #3a0508, 0 0 22px rgba(255, 60, 40, .7); }
#banner.blue { color: #cfe4ff; text-shadow: 0 3px 0 #0f2a78, 0 0 22px rgba(80, 150, 255, .8); }
#banner.boss { color: #ff4a3a; text-shadow: 0 3px 0 #2a0206, 0 0 30px rgba(255, 30, 20, .9);
  background: repeating-linear-gradient(135deg, rgba(255, 200, 40, .0) 0 14px, rgba(255, 200, 40, .0) 14px 28px), linear-gradient(90deg, transparent, rgba(20, 0, 4, .78) 20%, rgba(20, 0, 4, .78) 80%, transparent); }
#banner.boss small { color: var(--gold); }
@keyframes banner { 0% { opacity: 0; transform: scale(1.7); } 12% { opacity: 1; transform: scale(1); } 78% { opacity: 1; transform: scale(1.03); } 100% { opacity: 0; transform: scale(1.1); } }
#say { position: absolute; left: 50%; top: max(21%, 128px); transform: translateX(-50%); padding: 6px 16px; font-weight: 700; font-size: 15px; letter-spacing: .08em; line-height: 1.4; text-align: center; text-wrap: balance; opacity: 0;
  background: rgba(18, 12, 30, .86); --cut: 7px; width: max-content; max-width: calc(100% - 32px); }
#say.show { animation: say 2.6s ease both; }
#say.alert { color: #ffb0a2; box-shadow: inset 0 0 0 2px var(--red); background: rgba(60, 8, 10, .88); }
@keyframes say { 0% { opacity: 0; transform: translate(-50%, -8px); } 10%, 82% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, 0); } }
#mile { position: absolute; right: 12px; top: 84px; font-family: var(--f-display); font-weight: 900; font-size: 24px; letter-spacing: .12em; color: var(--gold-lt);
  text-shadow: 0 2px 0 #3a2203, 0 0 14px rgba(255, 190, 40, .8); opacity: 0; transform-origin: 100% 50%; }
#mile.show { animation: mile 1.5s ease both; }
@keyframes mile { 0% { opacity: 0; transform: scale(2.2) rotate(-6deg); } 14% { opacity: 1; transform: scale(1) rotate(-6deg); } 80% { opacity: 1; transform: scale(1) rotate(-6deg); } 100% { opacity: 0; transform: scale(.9) rotate(-6deg); } }
#hint { position: absolute; left: 50%; bottom: 22%; transform: translateX(-50%); padding: 8px 18px; font-weight: 700; letter-spacing: .1em; white-space: nowrap;
  background: rgba(18, 12, 30, .82); --cut: 8px; animation: nudge 1.1s ease-in-out infinite alternate; }
#hint.up { bottom: 36%; }
@keyframes nudge { from { transform: translateX(calc(-50% - 10px)); } to { transform: translateX(calc(-50% + 10px)); } }

/* ---------- 主畫面 ---------- */
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; gap: 14px; padding: max(18px, 4vh) 18px max(18px, 3vh); touch-action: pan-y;
  background: linear-gradient(180deg, rgba(14, 10, 28, .78) 0%, rgba(14, 10, 28, .35) 34%, rgba(14, 10, 28, .55) 62%, rgba(14, 10, 28, .92) 100%); overflow-y: auto; }
.logo { text-align: center; margin-top: 2vh; }
.logo .tagline { margin: 0 0 2px; font-size: 13px; letter-spacing: .5em; text-indent: .5em; color: var(--gold-lt); opacity: .9; }
.logo h1 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: clamp(52px, 19vmin, 92px); line-height: 1.05; letter-spacing: .06em; text-indent: .06em;
  background: linear-gradient(180deg, #fff6cf 8%, #ffd04a 46%, #c9820d 82%); -webkit-background-clip: text; background-clip: text; color: transparent;

<script>
(function () {
'use strict';
/* ===== 10-core: 常數、工具、亂數、道路模型 ===== */
const TAU = Math.PI * 2;
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (t) => t * t * (3 - 2 * t);

// 模擬用的可重現亂數（特效另外用 Math.random，不影響戰局）
let _seed = 20261004;
function srand(s) { _seed = s >>> 0; }
function rnd() {
  _seed = (_seed + 0x6D2B79F5) | 0;
  let t = Math.imul(_seed ^ (_seed >>> 15), 1 | _seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const rr = (a, b) => a + (b - a) * rnd();

// 戰場座標：x 橫向、z 縱深（0 = 我方城牆，L = 敵城城門）、y 高度
const L = 110;          // 戰場縱深
const WALLZ = 0;        // 我方城牆
const CANZ = -3.2;      // 兵砲所在
const BSPD = 11;        // 我軍行軍速度
const RAD = 0.36;       // 小兵半徑
const HIT2 = (RAD * 2) * (RAD * 2);
const PLAZA_HW = 11.5;  // 前庭半寬
const CAN_LIM = PLAZA_HW - 2.4;

// 道路：中心線 cx(z) 與半寬 hw(z)，每 0.5 取樣
const ZMIN = -16, RDZ = 0.5;
const RN = Math.ceil((L + 14 - ZMIN) / RDZ) + 2;
const roadCx = new Float32Array(RN), roadHw = new Float32Array(RN);

function interpPts(pts, z) {
  if (z <= pts[0][0]) return pts[0][1];
  const n = pts.length;
  if (z >= pts[n - 1][0]) return pts[n - 1][1];
  for (let i = 1; i < n; i++) {
    if (z <= pts[i][0]) {
      const a = pts[i - 1], b = pts[i];
      return lerp(a[1], b[1], smooth((z - a[0]) / (b[0] - a[0])));
    }
  }
  return pts[n - 1][1];
}
function buildRoad(def) {
  for (let i = 0; i < RN; i++) {
    const z = ZMIN + i * RDZ;
    roadCx[i] = interpPts(def.c, z);
    roadHw[i] = interpPts(def.w, z);
  }
}
function rcx(z) {
  let f = (z - ZMIN) / RDZ;
  if (f < 0) f = 0; else if (f > RN - 1.001) f = RN - 1.001;
  const i = f | 0;
  return roadCx[i] + (roadCx[i + 1] - roadCx[i]) * (f - i);
}
function rhw(z) {
  let f = (z - ZMIN) / RDZ;
  if (f < 0) f = 0; else if (f > RN - 1.001) f = RN - 1.001;
  const i = f | 0;
  return roadHw[i] + (roadHw[i + 1] - roadHw[i]) * (f - i);

const LANE_PAD = 0.5;
function laneX(t, z) { return rcx(z) + t * (rhw(z) - LANE_PAD); }
function laneT(x, z) { return clamp((x - rcx(z)) / (rhw(z) - LANE_PAD), -1, 1); }

function tri(p) { p = p - Math.floor(p); return p < 0.5 ? p * 4 - 1 : 3 - p * 4; }

function fmt(n) { return Math.round(n).toString().replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

   地面上的點 (x, z)：inv = 1/(1+z·g)，螢幕 x = cx + x·s0·inv，螢幕 y = yH + C·inv，
   該處的比例尺 = s0·inv（每世界單位幾個像素）。越遠 inv 越小，東西越小、越靠近上方。 */
const V = { W: 0, H: 0, cx: 0, u: 1, s0: 0, k: 0.336, g: 0, y0: 0, yT: 0, yH: 0, C: 0, ky: 0.92, q0: 1 };

  const n = RN, xl = new Float32Array(n), xr = new Float32Array(n), yy = new Float32Array(n), sc = new Float32Array(n);
  let iF = 0;

  c.fillStyle = lg(c, 0, yP, 0, yP2, [0, T.plaza, 1, 'rgba(0,0,0,0)']); c.globalAlpha = 0.9;
  c.fillRect(0, yP2, W, H - yP2); c.globalAlpha = 1;
  c.strokeStyle = 'rgba(0,0,0,.09)'; c.lineWidth = Math.max(1, 1.1 * u);

    else if (T.deco === 6) { c.fillStyle = rs() < 0.5 ? '#4f8a55' : '#7fae6a'; for (let j = -1; j <= 1; j++) { poly(c, [PX + j * 0.16 * s - 0.08 * s, PY, PX + j * 0.2 * s, PY - 0.4 * s, PX + j * 0.16 * s + 0.08 * s, PY]); c.fill(); } }
    else { poly(c, [PX - 0.3 * s, PY, PX - 0.12 * s, PY - 0.34 * s, PX + 0.22 * s, PY - 0.26 * s, PX + 0.32 * s, PY]); fs(c, T.deco === 3 ? '#2a1c1a' : T.deco === 4 ? '#3a2c50' : '#c98a4a', 'rgba(0,0,0,.35)', Math.max(0.6, 0.05 * s)); }
  }
  if (T.deco === 3 || T.deco === 4) {   // 發光裂紋
    for (let k = 0; k < 46; k++) {
      const z = 26 + rs() * (L - 30), t = rs() * 1.8 - 0.9; P(rcx(z) + t * (rhw(z) - 1), z); const s = PS;
      c.strokeStyle = T.deco === 3 ? 'rgba(255,150,40,.7)' : 'rgba(255,110,240,.55)'; c.lineWidth = Math.max(0.8, 0.09 * s);
      let x = PX, y = PY; c.beginPath(); c.moveTo(x, y); for (let j = 0; j < 4; j++) { x += (rs() - 0.5) * 1.2 * s; y += (rs() - 0.3) * 0.5 * s; c.lineTo(x, y); } c.stroke();
    }
  }

  paintFort(c, T, ruined);

  // 我方本陣（城牆後面）與兵砲軌道
  {
    P(0, -1.2); const yb = PY;
    c.save(); pathRoad(0, Math.round((-1.2 - ZMIN) / RDZ), 0.85); c.clip();
    c.fillStyle = 'rgba(24,34,70,.34)'; c.fillRect(0, yb, W, H - yb);
    for (const dz of [-0.75, 0.75]) { P(-CAN_LIM - 1.6, CANZ + dz); const ax = PX, ay = PY; P(CAN_LIM + 1.6, CANZ + dz); c.strokeStyle = '#2a3046'; c.lineWidth = 0.34 * PS; c.beginPath(); c.moveTo(ax, ay); c.lineTo(PX, PY); c.stroke(); c.strokeStyle = '#8d97b0'; c.lineWidth = 0.1 * PS; c.stroke(); }
    c.strokeStyle = '#4a3320'; for (let x = -CAN_LIM - 1.2; x <= CAN_LIM + 1.2; x += 1.3) { P(x, CANZ - 1.05); const ax = PX, ay = PY; P(x, CANZ + 1.05); c.lineWidth = 0.3 * PS; c.beginPath(); c.moveTo(ax, ay); c.lineTo(PX, PY); c.stroke(); }
    for (const dz of [-0.75, 0.75]) { P(-CAN_LIM - 1.6, CANZ + dz); const ax = PX, ay = PY; P(CAN_LIM + 1.6, CANZ + dz); c.strokeStyle = '#2a3046'; c.lineWidth = 0.3 * PS; c.beginPath(); c.moveTo(ax, ay); c.lineTo(PX, PY); c.stroke(); c.strokeStyle = '#a9b4cc'; c.lineWidth = 0.09 * PS; c.stroke(); }

/* ---------- 行軍關：一座筆直的橋 ----------

// 行軍關的大型佈景（橋頭堡、牌樓、小島、橋面浮雕）畫在另一張 1024×1024 的圖上，當第二張貼圖用

    fs(c, A[2]); fs(c, lg(c, 0, gy - 290, 0, gy - 246, [0, 'rgba(255,255,255,.16)', 1, 'rgba(0,0,0,.35)']), ink, 3);
    c.strokeStyle = 'rgba(0,0,0,.22)'; c.lineWidth = 2; for (let x = cx - px; x <= cx + px; x += 16) { c.beginPath(); c.moveTo(x, gy - 288); c.lineTo(x - (x - cx) * 0.03, gy - 250); c.stroke(); }

function fxStep(dt, rdt) {
  FX.time += rdt; FX.bodies = 0; FX.puffs = 0;
  // 殺敵速率（每秒）— 給音效與戰況條用
  FX.killRate += (FX.killsF / Math.max(rdt, 0.001) - FX.killRate) * Math.min(1, rdt * 6); FX.killsF = 0;
  if (FX.shake > 0.1) { const a = FX.shake * V.u; FX.shx = (R01() * 2 - 1) * a; FX.shy = (R01() * 2 - 1) * a; FX.shake *= Math.pow(0.0025, rdt); } else { FX.shake = 0; FX.shx = FX.shy = 0; }
  if (FX.flash > 0) FX.flash -= rdt * 2.6;
  if (FX.dark > 0) FX.dark -= rdt * (S.ult.active ? 0 : 0.9);
  if (FX.muzzle > 0) FX.muzzle -= rdt * 9;
  if (FX.wallFlash > 0) FX.wallFlash -= rdt * 3.5;
  if (FX.fortShake > 0) FX.fortShake -= rdt * 8;
  if (FX.redVig > 0) FX.redVig -= rdt * 1.5;
  FX.surge += ((S.surge.on > 0 && S.state === 'play' ? 1 : 0) - FX.surge) * Math.min(1, rdt * 4);
  // 烽火：一道火牆從城牆往前掃
  const bn = S.burn;
  if (bn.active && bn.zf < bn.z1) {
    for (let k = 0; k < (FX.low ? 7 : 13); k++) {
      const x = rnf(-PLAZA_HW, PLAZA_HW);
      pt(R01() < 0.5 ? SP_SOFT : SP_PUFF, x, bn.zf + rnf(-0.8, 0.8), rnf(0.2, 1.4), rnf(-1, 1), rnf(2, 6), rnf(3, 9), rnf(0.3, 0.55), rnf(1.4, 2.6), R01() < 0.6 ? rgba(255, 150, 30, 150) : rgba(255, 80, 20, 170), PF_ADD | PF_GROW, -4);
    }
    addShake(5);
  }
  if (FX.slowT > 0) { FX.slowT -= rdt; if (FX.slowT <= 0) FX.slow = 1; }
  if (FX.armyPop > 0) FX.armyPop -= rdt * 5;
  for (const f of S.strafes) {
    if (f.t < f.warn || f.t > f.warn + f.dur) continue;
    for (let k = Math.round((FX.low ? 5 : 12) * f.w / FIRE_W); k > 0; k--) {
      const z = f.zf + rnf(0, FIRE_TRAIL), x = f.x + rnf(-0.5, 0.5) * f.w;
      pt(R01() < 0.6 ? SP_SOFT : SP_PUFF, x, z, rnf(0.2, 1.2), rnf(-1, 1), rnf(-6, 2), rnf(3, 9), rnf(0.3, 0.55), rnf(1.4, 2.8), R01() < 0.6 ? rgba(255, 160, 40, 170) : rgba(255, 80, 20, 180), PF_ADD | PF_GROW, -4);
    }
  }
  const fd = S.flood;
  if (fd && fd.t < fd.dur) {
    for (let k = 0; k < (FX.low ? 5 : 11); k++) {
      const z = fd.zf + rnf(-0.5, 1.5), x = rcx(z) + rnf(-1, 1) * rhw(z);
      pt(R01() < 0.6 ? SP_PUFF : SP_DOT, x, z, rnf(0.2, 1.5), rnf(-3, 3), rnf(-9, -3), rnf(4, 11), rnf(0.35, 0.7), rnf(0.6, 1.9), R01() < 0.5 ? rgba(235, 248, 255, 235) : rgba(130, 200, 255, 230), PF_GROW, 14);
    }
    addShake(7);
  }
  // 行軍關：世界往下捲了多少，粒子和浮字就跟著退多少
  if (S.scrollAcc) { const dz = S.scrollAcc; S.scrollAcc = 0; for (let i = 0; i < pn; i++) pZ[i] -= dz; for (const f of FX.floats) f.z -= dz; }
  // 粒子
  for (let i = pn - 1; i >= 0; i--) {
    const life = pLife[i] - dt;
    if (life <= 0) { const j = --pn; if (i !== j) { pSp[i] = pSp[j]; pX[i] = pX[j]; pZ[i] = pZ[j]; pY[i] = pY[j]; pVX[i] = pVX[j]; pVZ[i] = pVZ[j]; pVY[i] = pVY[j]; pLife[i] = pLife[j]; pMax[i] = pMax[j]; pSize[i] = pSize[j]; pCol[i] = pCol[j]; pFl[i] = pFl[j]; pGrav[i] = pGrav[j]; pRot[i] = pRot[j]; pVR[i] = pVR[j]; } continue; }
    pLife[i] = life;
    pVY[i] -= pGrav[i] * dt;
    pX[i] += pVX[i] * dt; pZ[i] += pVZ[i] * dt; pY[i] += pVY[i] * dt; pRot[i] += pVR[i] * dt;
    if (pY[i] < 0 && pGrav[i] > 0) {
      if (pFl[i] & PF_BOUNCE) { pY[i] = 0; pVY[i] *= -0.4; pVX[i] *= 0.6; pVZ[i] *= 0.6; pVR[i] *= 0.5; }
      else if (pFl[i] & PF_ARROW) {
        // 箭落地：插在地上停一下、揚一點塵
        pY[i] = 0; pVX[i] = pVZ[i] = pVY[i] = 0; pGrav[i] = 0; pFl[i] &= ~PF_ARROW; pLife[i] = pMax[i] = 0.4;

    const q = S.sq; P(q.x, MZ_REAR - 3.4); const h = 2.5 * PS, str = String(S.B.n), tw = textW(str, h);

    auInit(); sfx('click');
    if (deferred) { deferred.prompt(); try { await deferred.userChoice; } catch (e) { /* 使用者關掉了 */ } deferred = null; return; }
    $('howText').textContent = inApp ? '這個 App 內建的瀏覽器不能安裝。請先點右上角選單，選「用預設瀏覽器開啟」，再回來按安裝。'
      : isIOS ? '在 Safari 點下方的「分享」按鈕，往下找到「加入主畫面」，就會多一個像 App 的圖示。'
        : '請打開瀏覽器的選單，選「安裝應用程式」或「加到主畫面」。';
    how.hidden = false;
  });

  if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* 沒有離線快取也能玩 */ }); });
  }
})();

})();
</script>
</body></html>
